/* =========================================
   BINARY TRAINER — built on the supplied
   Duolingo Design System & UI Kit
   ========================================= */
:root{
  /* kit palette */
  --color-ecto-green:#58cc02; --color-ecto-green-dark:#58a700;
  --color-lingot-lime:#a5ed6e; --color-eel-light:#d7ffb8;
  --color-macaw-blue:#1cb0f6; --color-macaw-blue-dark:#1899d6;
  --color-cardinal:#ff4b4b; --color-cardinal-dark:#ea2b2b;
  --color-fox:#ff9600; --color-bee:#ffc800; --color-bee-dark:#e5b000;
  --color-beetle:#ce82ff;
  --color-graphite:#3c3c3c; --color-ash:#777777;
  --color-swan:#e5e5e5; --color-polar:#f7f7f7; --color-paper:#ffffff;

  /* kit typography */
  --font-main:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font:var(--font-main);

  /* kit spacing & radii */
  --spacing-sm:8px; --spacing-md:16px; --spacing-lg:24px;
  --spacing-xl:32px; --spacing-2xl:48px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;

  /* component aliases */
  --green:var(--color-ecto-green); --green-deep:var(--color-ecto-green-dark);
  --green-light:var(--color-lingot-lime); --green-pale:var(--color-eel-light);
  --blue:var(--color-macaw-blue); --blue-deep:var(--color-macaw-blue-dark); --blue-pale:#ddf4ff;
  --red:var(--color-cardinal); --red-deep:var(--color-cardinal-dark); --red-pale:#ffdfe0;
  --orange:var(--color-fox); --orange-deep:#e08600;
  --gold:var(--color-bee); --gold-deep:var(--color-bee-dark);
  --purple:var(--color-beetle); --purple-deep:#a560e0;
  --ink:var(--color-graphite); --ink-strong:#4b4b4b;
  --ink-soft:var(--color-ash); --ink-mute:#afafaf;
  --line:var(--color-swan); --line-strong:#d1d1d1; --soft:var(--color-polar);
  --r-card:var(--radius-lg); --r-btn:var(--radius-lg); --r-sm:var(--radius-md); --pill:var(--radius-pill);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --spring:cubic-bezier(0.34,1.56,0.64,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--color-paper);color:var(--color-graphite);
  font-family:var(--font-main);font-size:16px;font-weight:500;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:clip;overscroll-behavior-y:contain;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.2;letter-spacing:-0.03em;color:var(--color-graphite)}
p{margin:0}
button{font:inherit;color:inherit;font-family:var(--font-main)}
img,svg{display:block}
a{color:var(--color-macaw-blue);text-decoration:none;font-weight:600}
::selection{background:var(--color-eel-light)}

/* ---------- icons ---------- */
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.14em;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;overflow:visible}
.ico-fill{fill:currentColor;stroke:none}
.hud-item .ico{width:22px;height:22px}
.hud-item.hearts .ico{width:18px;height:18px}
.btn .ico{width:17px;height:17px}
.keypad .ico{width:22px;height:22px}
.pill .ico{width:13px;height:13px}
.feedback .icon .ico{width:20px;height:20px;stroke-width:3}
.modal .emoji .ico{width:32px;height:32px}
.badge .ico{width:24px;height:24px}
.takeaway .ico{width:15px;height:15px;vertical-align:-2px}
.stat-line .ico{width:14px;height:14px}
.result-stars .ico{width:36px;height:36px}
.pc-icon .ico{width:26px;height:26px}
.avatar .ico{width:36px;height:36px}
.node-icon .ico{width:24px;height:24px}
.node-card .stars .ico{width:16px;height:16px}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.app{max-width:720px;margin:0 auto;min-height:100dvh;position:relative;z-index:2}

/* ---------- screens ---------- */
.screen{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;
  padding:16px 16px 32px;animation:screenIn .26s ease-out both;width:100%}
.screen.has-tabs{padding-bottom:104px}
.screen.from-right{animation-name:screenInRight}
.screen.from-left{animation-name:screenInLeft}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes screenInRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes screenInLeft{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

/* ---------- buttons (kit: 3D physics) ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--radius-lg);font-family:var(--font-main);font-weight:700;
  font-size:15px;letter-spacing:.8px;text-transform:uppercase;padding:14px 24px;
  border:2px solid transparent;background:var(--color-ecto-green);color:var(--color-paper);
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;line-height:1.1;
  box-shadow:0 4px 0 var(--color-ecto-green-dark);
  transition:transform .1s cubic-bezier(0.34,1.56,0.64,1),box-shadow .1s,filter .2s;
  text-decoration:none;
}
.btn:hover:not([disabled]):not([aria-disabled="true"]){filter:brightness(1.05);transform:translateY(-2px)}
.btn:active:not([disabled]):not([aria-disabled="true"]){transform:translateY(4px)!important;box-shadow:0 0 0 transparent!important}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--color-swan);color:var(--color-ash);box-shadow:0 4px 0 #d1d1d1;pointer-events:none}
.btn-primary{background:var(--color-ecto-green);color:var(--color-paper);box-shadow:0 4px 0 var(--color-ecto-green-dark)}
.btn-secondary{background:var(--color-paper);color:var(--color-macaw-blue);border-color:var(--color-swan);box-shadow:0 4px 0 var(--color-swan)}
.btn-neutral{background:var(--color-paper);color:var(--color-ash);border-color:var(--color-swan);box-shadow:0 4px 0 var(--color-swan)}
.btn-danger{background:var(--color-cardinal);color:var(--color-paper);box-shadow:0 4px 0 var(--color-cardinal-dark)}
.btn-ghost{background:transparent;border:none;box-shadow:none;min-width:0;color:var(--color-ash);padding:10px 12px}
.btn-ghost:hover{background:var(--color-polar);filter:none;transform:none}
.btn-ghost:active{transform:none!important}
.btn-sm{font-size:13px;padding:11px 16px;border-radius:var(--radius-md)}
.btn-lg{font-size:16px;padding:16px 24px}
.btn.block{display:flex;width:100%}
.icon-btn{
  width:40px;height:40px;display:grid;place-items:center;border-radius:var(--radius-md);border:none;
  background:transparent;cursor:pointer;color:var(--color-ash);font-size:20px;font-weight:700;
  transition:background .15s ease,transform .1s ease,color .15s ease;flex:0 0 auto;padding:0;
}
.icon-btn:hover{background:var(--color-polar);color:var(--color-graphite)}
.icon-btn:active{transform:scale(.92)}

/* ---------- HUD (kit: bordered state bar) ---------- */
.hud{
  display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--color-paper);
  border-radius:var(--radius-lg);border:2px solid var(--color-swan);box-shadow:0 2px 0 var(--color-swan);
  margin-bottom:16px;flex-wrap:nowrap;
}
.hud-item{display:flex;align-items:center;gap:5px;font-weight:700;font-size:18px;color:var(--color-graphite);font-variant-numeric:tabular-nums}
.hud-item b{font-weight:700}
.hud-item.streak span:first-child{color:var(--color-fox)}
.hud-item.streak b{color:var(--color-fox)}
.hud-item.speed span:first-child{color:var(--color-macaw-blue)}
.hud-item.speed b{color:var(--color-macaw-blue)}
.hud-item.gems span:first-child{color:var(--color-beetle)}
.hud-item.gems b{color:var(--color-beetle)}
.hud-item.hearts{margin-left:auto;gap:1px;color:var(--color-cardinal);border:none;background:none;padding:0;cursor:pointer;font-family:inherit;align-items:center}
.hud-item.hearts:active{transform:scale(.94)}
.heart-timer{font-size:10px;font-weight:700;color:var(--color-ash);letter-spacing:.2px;margin-left:5px;font-variant-numeric:tabular-nums}
.heart{color:var(--color-cardinal);display:inline-block}
.heart.empty{color:var(--color-swan)}
.heart.lost{animation:heartPop .45s ease}
@keyframes heartPop{0%{transform:scale(1)}35%{transform:scale(1.5) rotate(-8deg)}100%{transform:scale(1)}}
.hud-item.hearts.low{animation:heartWarn 1.6s ease-in-out infinite}
@keyframes heartWarn{0%,100%{opacity:1}50%{opacity:.5}}
.flame{display:inline-block;transform-origin:50% 90%}
.flame.active{animation:flicker 1.6s ease-in-out infinite}
.flame.cold{filter:grayscale(1);opacity:.45}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}30%{transform:scale(1.1) rotate(3deg)}60%{transform:scale(.96) rotate(-3deg)}80%{transform:scale(1.06) rotate(1deg)}}
.hud-level{
  display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--color-ash);margin-left:auto;white-space:nowrap;
}
.hud-level b{font-size:12px;color:var(--color-graphite)}
.hud-item.hearts + .hud-level{margin-left:0}
.odo{display:inline-block;min-width:1.2ch;text-align:right}

/* ---------- cards (kit) ---------- */
.card{
  background:var(--color-paper);border:2px solid var(--color-swan);border-radius:var(--radius-lg);
  padding:24px;box-shadow:0 2px 0 var(--color-swan);
}
.hero{display:flex;align-items:center;gap:20px;margin:0 0 8px;padding:20px}
.hero .mascot{flex:0 0 84px;width:84px;height:84px}
.hero h1{font-size:22px;line-height:1.2;letter-spacing:-0.03em}
.hero p{color:var(--color-ash);font-size:14px;font-weight:500;margin-top:4px;line-height:1.45}
.hero .cta{margin-top:16px;font-size:13px;padding:12px 18px;letter-spacing:.8px}
.hero .grow{min-width:0}

/* ---------- mascot (kit "Byte") ---------- */
.mascot{width:96px;height:96px;animation:floatBot 3s ease-in-out infinite;transform-origin:50% 90%}
.mascot.small{width:64px;height:64px}
.mascot.worried{animation:worried .5s ease-in-out 2}
.mascot.celebrate{animation:celebrate .9s var(--spring) 2}
@keyframes floatBot{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes worried{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-4deg) translateY(2px)}75%{transform:rotate(4deg) translateY(2px)}}
@keyframes celebrate{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) scale(1.08) rotate(-10deg)}60%{transform:translateY(-6px) scale(1.04) rotate(8deg)}100%{transform:none}}

/* ---------- learning path (kit: cards + dashed connector) ---------- */
.unit-group{margin-bottom:8px}
.section-block{position:relative}
.section-banner{
  position:sticky;top:8px;z-index:20;
  margin:24px 0 10px;padding:18px 20px;border-radius:var(--radius-lg);color:var(--color-paper);
  background:var(--color-ecto-green);box-shadow:0 4px 0 var(--color-ecto-green-dark),0 10px 24px rgba(0,0,0,.10);
  border:2px solid var(--color-ecto-green-dark);
  transition:box-shadow .2s ease,transform .2s ease;
}
.section-banner.stuck{box-shadow:0 4px 0 var(--color-ecto-green-dark),0 14px 28px rgba(0,0,0,.16)}
.section-banner .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;opacity:.92}
.section-banner h2{font-size:22px;color:var(--color-paper);margin-top:2px;letter-spacing:-0.03em}
.section-banner p{font-size:13px;font-weight:500;opacity:.94;margin-top:2px;line-height:1.4}
.unit-header{display:flex;align-items:center;gap:8px;margin:22px 2px 4px}
.unit-header .dot{width:8px;height:8px;border-radius:2px;background:var(--color-ecto-green)}
.unit-header h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--color-ash)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:58px;padding:48px 0 16px;width:100%}
.path-line{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
.path-line path{fill:none;stroke:var(--color-swan);stroke-width:8;stroke-linecap:round;stroke-dasharray:12 12;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.node-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;
  animation:nodeIn .4s var(--spring) both;transition:transform .2s ease}
@keyframes nodeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.node-card{
  display:flex;align-items:center;gap:14px;width:min(268px,88%);padding:14px;
  background:var(--color-paper);border:2px solid var(--color-swan);border-radius:var(--radius-lg);
  box-shadow:0 4px 0 var(--color-swan);cursor:pointer;text-align:left;font-family:var(--font-main);
  transition:transform .15s cubic-bezier(0.34,1.56,0.64,1),box-shadow .15s;
}
.node-card:hover{transform:translateY(-4px);box-shadow:0 8px 0 var(--color-swan)}
.node-card:active{transform:translateY(4px);box-shadow:none}
.node-card.completed,.node-card.active{border-color:var(--color-ecto-green);box-shadow:0 4px 0 var(--color-ecto-green-dark)}
.node-card.completed:hover,.node-card.active:hover{box-shadow:0 8px 0 var(--color-ecto-green-dark)}
.node-card.legendary{border-color:var(--color-bee);box-shadow:0 4px 0 var(--color-bee-dark)}
.node-card.locked{background:var(--color-polar);color:var(--color-ash);cursor:not-allowed}
.node-card.locked:hover{transform:none;box-shadow:0 4px 0 var(--color-swan)}
.node-icon{width:48px;height:48px;border-radius:50%;background:var(--color-swan);display:grid;place-items:center;
  flex:0 0 auto;color:var(--color-ash)}
.node-card.completed .node-icon{background:var(--color-eel-light);color:var(--color-ecto-green-dark)}
.node-card.active .node-icon{background:var(--color-ecto-green);color:var(--color-paper);animation:pulse 2s infinite}
.node-card.legendary .node-icon{background:var(--color-bee);color:var(--color-paper)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,204,2,.4)}70%{box-shadow:0 0 0 10px rgba(88,204,2,0)}100%{box-shadow:0 0 0 0 rgba(88,204,2,0)}}
.node-content{display:flex;flex-direction:column;min-width:0}
.node-title{font-size:16px;font-weight:700;color:var(--color-graphite);line-height:1.25}
.node-subtitle{font-size:13px;font-weight:500;color:var(--color-ash);margin-top:2px;line-height:1.3}
.node-card.locked .node-title{color:var(--color-ash)}
.node-card.locked .node-subtitle{color:#b3b3b3}
.node-card .stars{
  position:static;display:flex;gap:4px;margin-top:8px;padding:0;background:none;border:none;box-shadow:none;
  justify-content:flex-start;font-size:16px;color:var(--color-bee);
}
.node-card .stars .off{color:var(--color-swan);opacity:1}
.node-card .crown{display:none}
.start-tooltip{
  position:absolute;top:-44px;left:50%;transform:translateX(-50%);
  background:var(--color-ecto-green);color:var(--color-paper);border:2px solid var(--color-ecto-green-dark);
  padding:6px 16px;border-radius:var(--radius-md);font-weight:700;font-size:14px;text-transform:uppercase;
  letter-spacing:.8px;box-shadow:0 4px 0 var(--color-ecto-green-dark);animation:float 2s infinite;
  white-space:nowrap;z-index:10;
}
.start-tooltip::after{
  content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%) rotate(45deg);
  width:12px;height:12px;background:var(--color-ecto-green);
  border-right:2px solid var(--color-ecto-green-dark);border-bottom:2px solid var(--color-ecto-green-dark);
}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.node-tip{
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);
  background:var(--color-graphite);color:var(--color-paper);font-size:12px;font-weight:600;
  padding:6px 10px;border-radius:var(--radius-sm);white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;z-index:5;
}
.node-wrap:hover .node-tip{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- sheet ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s ease;z-index:60}
.sheet-backdrop.open{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--color-paper);
  border-radius:24px 24px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.12);transform:translateY(102%);
  transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);
  max-width:720px;margin:0 auto;max-height:88dvh;overflow:auto;
}
.sheet::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--color-swan);margin:0 auto 18px}
.sheet.open{transform:none}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.sheet h2{font-size:24px;line-height:1.2}
.sheet .sub{color:var(--color-ash);font-size:14px;font-weight:500;margin-top:2px}
.sheet .stat-row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.sheet .stat-row .chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--color-polar);border:2px solid var(--color-swan);
  border-radius:var(--pill);height:32px;padding:0 12px;font-size:12px;font-weight:700;color:var(--color-ash);
  letter-spacing:.3px;text-transform:uppercase;
}
.sheet .stat-row .chip .ico{width:14px;height:14px}
.sheet .actions{display:flex;flex-direction:column;gap:10px}

/* ---------- theory ---------- */
.theory{padding-top:8px}
.theory-top{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--color-swan);transition:all .2s ease}
.dots i.on{background:var(--color-ecto-green);transform:scale(1.2)}
.theory-card{
  background:var(--color-paper);border-radius:var(--radius-lg);padding:24px;
  border:2px solid var(--color-swan);box-shadow:0 2px 0 var(--color-swan);
  flex:0 0 auto;display:flex;flex-direction:column;
}
.theory-card h1{font-size:clamp(24px,5.6vw,30px);margin:6px 0 12px;line-height:1.15;letter-spacing:-0.03em}
.theory-card p{color:var(--color-ash);font-size:16px;font-weight:500;line-height:1.6}
.theory-visual{
  margin:20px 0;min-height:154px;border-radius:var(--radius-md);background:var(--color-polar);
  display:grid;place-items:center;padding:16px;overflow:hidden;border:2px solid var(--color-swan);
}
.takeaway{
  align-self:flex-start;margin-top:18px;background:var(--color-eel-light);color:var(--color-ecto-green-dark);
  border:none;border-radius:var(--pill);padding:10px 16px;font-weight:700;font-size:13px;letter-spacing:.2px;
  line-height:1.35;display:inline-flex;gap:6px;
}
.theory-footer{margin-top:auto;padding-top:18px;display:flex;gap:8px;align-items:center}

/* ---------- theory visual widgets ---------- */
.vis-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.vis-bulbs{display:flex;gap:10px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.vis-bulb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--color-ash)}
.vis-bulb .globe{width:26px;height:26px;border-radius:50%;background:var(--color-swan);border:2px solid #d7d7d7;transition:all .25s var(--spring)}
.vis-bulb.lit .globe{background:var(--color-ecto-green);border-color:var(--color-ecto-green-dark);box-shadow:0 0 0 4px rgba(88,204,2,.18);transform:translateY(-3px)}
.vis-bulb.lit span{color:var(--color-ecto-green-dark)}
.vis-table{display:flex;flex-direction:column;gap:4px;width:100%;max-width:300px}
.vis-table .row{display:flex;justify-content:space-between;padding:6px 10px;border-radius:var(--radius-sm);
  background:var(--color-paper);border:2px solid var(--color-swan);font-family:var(--mono);font-size:13px;font-weight:600;
  animation:rowIn .3s ease both}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.vis-chart{display:flex;gap:6px;flex-wrap:nowrap;justify-content:center}
.vis-chart .cell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--color-ash)}
.vis-chart .cell b{display:grid;place-items:center;width:28px;height:34px;border-radius:var(--radius-sm);
  background:var(--color-paper);border:2px solid var(--color-swan);color:var(--color-ash);transition:all .2s ease}
.vis-chart .cell.lit b{background:var(--color-ecto-green);border-color:var(--color-ecto-green-dark);color:var(--color-paper)}
.vis-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:260px}
.vis-grid div{background:var(--color-paper);border:2px solid var(--color-swan);border-radius:var(--radius-sm);
  text-align:center;font-family:var(--mono);font-size:12px;padding:4px;animation:popIn .3s var(--spring) both;font-weight:700}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.vis-split{display:flex;gap:8px;font-family:var(--mono);font-weight:700;font-size:20px}
.vis-split .hi{background:var(--color-eel-light);color:var(--color-ecto-green-dark);padding:6px 10px;border-radius:var(--radius-sm)}
.vis-split .lo{background:var(--blue-pale);color:var(--color-macaw-blue-dark);padding:6px 10px;border-radius:var(--radius-sm)}
.vis-arrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:16px;color:var(--color-ash)}
.vis-div{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:13px;background:var(--color-paper);
  border:2px solid var(--color-swan);border-radius:var(--radius-md);padding:8px 14px}
.vis-div span b{color:var(--color-ecto-green-dark)}
.vis-stopwatch{font-size:34px;font-weight:700;letter-spacing:1px;color:var(--color-graphite);font-variant-numeric:tabular-nums}
.vis-stopwatch.pulse{animation:tickPulse 1s ease-in-out infinite}
@keyframes tickPulse{0%,100%{transform:scale(1);color:var(--color-graphite)}50%{transform:scale(1.06);color:var(--color-cardinal)}}
.vis-list{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;color:var(--color-ash)}
.vis-list .tick{color:var(--color-ecto-green-dark)}
.vis-race{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.vis-race .lane{position:relative;height:14px;border-radius:var(--radius-sm);background:var(--color-swan);overflow:hidden}
.vis-race .lane i{position:absolute;inset:0 auto 0 0;border-radius:var(--radius-sm);background:var(--color-macaw-blue);animation:laneFill 2.4s ease-in-out infinite alternate}
.vis-race .lane.win i{background:var(--color-ecto-green);animation-duration:1.2s}
@keyframes laneFill{from{width:12%}to{width:96%}}

/* ---------- player (kit: sim header / body / footer) ---------- */
.player{padding:12px 16px 16px}
.player-top{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--color-paper);
  border:2px solid var(--color-swan);border-radius:var(--radius-lg);box-shadow:0 2px 0 var(--color-swan);margin-bottom:14px}
.player-top .icon-btn{width:28px;height:28px;font-size:22px;color:var(--color-swan);color:#b9b9b9}
.pbar-wrap{position:relative;flex:1;min-width:0}
.pbar{display:flex;height:16px;width:100%;background:var(--color-swan);border-radius:var(--radius-pill);overflow:hidden}
.pbar.boss{display:block;background:var(--color-swan);border-radius:var(--radius-pill);overflow:hidden}
.pbar.boss i{display:block;height:100%;width:100%;background:var(--color-ecto-green);border-radius:var(--radius-pill);transform-origin:left;transition:transform .1s linear}
.pseg{flex:1;position:relative;background:var(--color-swan)}
.pseg:not(:last-child){border-right:4px solid var(--color-paper)}
.pseg i{position:absolute;inset:0;width:0;background:var(--color-ecto-green);transition:width .32s var(--spring)}
.pseg.on i{width:100%}
.pseg.now{background:#f0f0f0}
.pseg.pop{animation:segPop .3s var(--spring)}
@keyframes segPop{0%{transform:scaleY(1)}40%{transform:scaleY(1.3)}100%{transform:scaleY(1)}}
.ghost{position:absolute;top:-24px;font-size:16px;transition:left .18s linear;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.ghost.ahead{color:var(--color-ecto-green-dark)}
.ghost.behind{color:var(--color-fox)}
.player-hearts{display:flex;align-items:center;gap:1px;font-size:17px;color:var(--color-cardinal);flex:0 0 auto;font-weight:700}
.player-hearts .ico{width:17px;height:17px}
.player-hearts .em{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--color-ash);display:inline-flex;align-items:center;gap:4px}
.player-sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 4px;min-height:28px}
.pill{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:var(--pill);
  background:var(--color-polar);border:2px solid var(--color-swan);font-weight:700;font-size:12px;
  color:var(--color-ash);letter-spacing:.3px;
}
.pill.combo{background:#fff4e5;border-color:#ffe0b2;color:var(--orange-deep)}
.pill.combo.off{display:none}
.pill.combo.fizzle{animation:fizzle .45s ease}
.pill.timer.low{background:#fff0f0;border-color:#ffd1d1;color:var(--color-cardinal);animation:heartWarn 1s ease-in-out infinite}
.pill.xp{background:#f3fbea;border-color:var(--color-eel-light);color:var(--color-ecto-green-dark)}
@keyframes fizzle{0%{transform:scale(1.1)}40%{transform:scale(.85) rotate(-6deg);opacity:.6}100%{transform:none;opacity:1}}
.combo{display:inline-flex;align-items:center;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--pill);background:var(--color-polar);border:2px solid var(--color-swan);font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--color-ash)}
.chip .ico{width:14px;height:14px}
.exercise{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:24px;padding:clamp(6px,2.4vh,20px) 0 8px;min-height:0}
.prompt{text-align:center}
.prompt .kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;color:var(--color-macaw-blue);margin-bottom:14px}
.prompt h1{font-size:clamp(21px,5.2vw,26px);line-height:1.3;letter-spacing:-0.03em;padding:0 4px}
.prompt .target{display:inline-block;font-size:clamp(42px,11.5vw,58px);font-weight:700;letter-spacing:-1.5px;
  line-height:1;font-variant-numeric:tabular-nums;animation:targetIn .3s var(--spring) both}
@keyframes targetIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.prompt .sub{color:var(--color-ash);font-size:14px;font-weight:500;margin-top:12px;line-height:1.45}

/* bits */
.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(3px,1.1vw,6px);max-width:540px;width:100%;margin:0 auto;min-width:0}
.bit-cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.place{font-size:clamp(9px,2.4vw,11px);font-weight:700;color:var(--color-ash);transition:color .18s ease,transform .18s ease}
.place.on{color:var(--color-ecto-green-dark);transform:translateY(-1px)}
.place.hidden{opacity:.22}
.bit{
  width:100%;height:clamp(46px,12.4vw,66px);min-height:0;border-radius:var(--radius-md);
  border:2px solid var(--color-swan);background:var(--color-paper);color:var(--color-ash);
  font-weight:700;font-size:clamp(14px,3.6vw,20px);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 4px 0 var(--color-swan);
  transition:background .14s ease,border-color .14s ease,color .14s ease,box-shadow .14s ease,transform .1s ease;
  -webkit-tap-highlight-color:transparent;
}
.bit:hover{border-color:#d1d1d1;background:var(--color-polar)}
.bit:active{transform:translateY(4px);box-shadow:none}
.bit[aria-pressed="true"]{background:var(--color-ecto-green);border-color:var(--color-ecto-green-dark);color:var(--color-paper);box-shadow:0 4px 0 var(--color-ecto-green-dark)}
.bit.flip{animation:bitFlip .32s var(--spring)}
@keyframes bitFlip{0%{transform:scale(1)}35%{transform:scale(1.12)}65%{transform:scale(.97)}100%{transform:scale(1)}}
.bit.glow{animation:bitGlow .5s ease}
@keyframes bitGlow{0%{box-shadow:0 0 0 0 rgba(88,204,2,.5)}100%{box-shadow:0 0 0 10px rgba(88,204,2,0)}}
.bit.wrong{animation:shake .3s ease;border-color:var(--color-cardinal);background:var(--red-pale);color:var(--color-cardinal-dark)}
.sum{text-align:center;font-weight:700;color:var(--color-ash);font-size:14px;font-variant-numeric:tabular-nums}
.sum b{color:var(--color-graphite);font-size:18px}
.sum .pop{display:inline-block;animation:sumPop .25s var(--spring)}
@keyframes sumPop{from{transform:scale(.8);color:var(--color-ecto-green-dark)}to{transform:none}}
.chart-toggle{display:block;margin:0 auto;font-size:12px;letter-spacing:.4px}

/* number input */
.num-wrap,.num-ex{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.num-display{display:flex;gap:6px;justify-content:center;min-height:64px;align-items:center;padding:0 8px}
.num-digit{
  min-width:44px;height:58px;border-radius:var(--radius-md);border:2px solid var(--color-macaw-blue);
  background:var(--blue-pale);display:grid;place-items:center;font-size:30px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--color-graphite);animation:digitIn .18s var(--spring) both;
  box-shadow:0 4px 0 var(--color-macaw-blue-dark);
}
@keyframes digitIn{from{opacity:0;transform:scale(.8) translateY(6px)}to{opacity:1;transform:none}}
.num-ghost{min-width:44px;height:58px;border-radius:var(--radius-md);border:2px dashed var(--color-swan);background:transparent}
.binchip{display:inline-flex;gap:5px;justify-content:center;flex-wrap:wrap;font-family:var(--mono);
  font-size:clamp(22px,6.8vw,30px);font-weight:700;letter-spacing:3px}
.binchip span{color:var(--ink-mute)}
.binchip span.one{color:var(--color-ecto-green-dark)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:320px}
.keypad button{
  min-height:56px;border-radius:var(--radius-md);border:2px solid var(--color-swan);background:var(--color-paper);
  color:var(--color-graphite);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--color-swan);
  transition:background .12s ease,transform .1s ease,box-shadow .1s ease;
}
.keypad button:hover{background:var(--color-polar)}
.keypad button:active{transform:translateY(4px);box-shadow:none}
.keypad button.wide{font-size:16px;color:var(--color-ash)}
.keypad button.enter{background:var(--color-ecto-green);border-color:var(--color-ecto-green-dark);color:var(--color-paper);box-shadow:0 4px 0 var(--color-ecto-green-dark)}
.keypad button.enter:active{box-shadow:none}

/* options (kit) */
.mcq{display:flex;flex-direction:column;gap:14px;max-width:540px;width:100%;margin:6px auto 0}
.mcq-opt{
  display:flex;align-items:center;gap:14px;padding:17px 16px;min-height:64px;border-radius:var(--radius-md);
  border:2px solid var(--color-swan);background:var(--color-paper);text-align:left;
  font-size:18px;font-weight:600;font-family:var(--font-main);color:var(--color-graphite);
  cursor:pointer;box-shadow:0 4px 0 var(--color-swan);transition:all .1s;
}
.mcq-opt:hover{background:var(--color-polar)}
.mcq-opt:active{transform:translateY(4px);box-shadow:none}
.mcq-opt .key{
  width:28px;height:28px;border-radius:var(--radius-sm);background:var(--color-polar);color:var(--color-ash);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto;text-transform:uppercase;
}
.mcq-opt[aria-pressed="true"]{border-color:var(--color-macaw-blue);background:var(--blue-pale);color:var(--color-macaw-blue);box-shadow:0 4px 0 var(--color-macaw-blue-dark)}
.mcq-opt[aria-pressed="true"] .key{background:var(--color-macaw-blue);color:var(--color-paper)}
.mcq-opt.correct{border-color:var(--color-ecto-green);background:var(--color-eel-light);color:var(--color-ecto-green-dark);box-shadow:0 4px 0 var(--color-ecto-green-dark)}
.mcq-opt.correct .key{background:var(--color-ecto-green);color:var(--color-paper)}
.mcq-opt.wrong{border-color:var(--color-cardinal);background:var(--red-pale);color:var(--color-cardinal-dark);box-shadow:0 4px 0 var(--color-cardinal-dark)}
.mcq-opt.wrong .key{background:var(--color-cardinal);color:var(--color-paper)}

/* BLANK */
.blank-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.blank-cell{
  width:clamp(38px,9vw,52px);height:clamp(50px,12vw,62px);border-radius:var(--radius-md);
  border:2px solid var(--color-swan);background:var(--color-paper);display:grid;place-items:center;
  font-family:var(--mono);font-size:25px;font-weight:700;color:var(--ink-mute);
}
.blank-cell.given{background:var(--color-polar);border-color:var(--color-swan)}
.blank-cell.fill{border-color:var(--color-macaw-blue);color:var(--color-graphite);background:var(--blue-pale);animation:digitIn .16s var(--spring)}
.blank-cell.hl{border-color:var(--color-ecto-green);box-shadow:0 0 0 4px rgba(88,204,2,.2)}

/* ORDER */
.order-bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:56px}
.order-slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:58px;padding:10px;
  border-radius:var(--radius-md);background:var(--color-polar);border:2px dashed var(--color-swan)}
.chip-item{
  min-height:48px;padding:0 16px;border-radius:var(--radius-md);border:2px solid var(--color-swan);
  background:var(--color-paper);color:var(--color-graphite);font-weight:700;font-size:18px;cursor:pointer;
  box-shadow:0 4px 0 var(--color-swan);transition:transform .1s ease,box-shadow .1s ease,opacity .12s ease;
  font-family:var(--mono);
}
.chip-item:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--color-swan)}
.chip-item:active{transform:translateY(2px);box-shadow:none}
.chip-item.placed{background:var(--color-eel-light);border-color:var(--color-ecto-green);color:var(--color-ecto-green-dark);box-shadow:0 4px 0 var(--color-ecto-green-dark);animation:popIn .2s var(--spring)}
.chip-item.dim{opacity:.3}

/* MATCH */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:540px;margin:0 auto;width:100%}
.match-col{display:flex;flex-direction:column;gap:10px}
.match-item{
  min-height:52px;border-radius:var(--radius-md);border:2px solid var(--color-swan);background:var(--color-paper);
  color:var(--color-graphite);font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--color-swan);
  transition:all .14s ease;font-family:var(--mono);
}
.match-item:hover{background:var(--color-polar)}
.match-item.sel{border-color:var(--color-macaw-blue);background:var(--blue-pale);color:var(--color-macaw-blue);box-shadow:0 4px 0 var(--color-macaw-blue-dark)}
.match-item.done{background:var(--color-eel-light);border-color:var(--color-ecto-green);color:var(--color-ecto-green-dark);box-shadow:none;opacity:.85;cursor:default}
.match-item.bad{animation:shake .3s ease;border-color:var(--color-cardinal);background:var(--red-pale)}

/* SPOT / FLASH */
.spot-hint{text-align:center;color:var(--color-ash);font-size:13px;font-weight:500}
.flash-bar{height:10px;border-radius:var(--pill);background:var(--color-swan);overflow:hidden;max-width:420px;margin:0 auto;width:100%}
.flash-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--color-macaw-blue),var(--color-fox),var(--color-cardinal));width:100%;transform-origin:left}
.flash-tag{display:inline-flex;align-items:center;gap:6px;background:#fff4e5;color:var(--orange-deep);
  border:2px solid #ffe0b2;padding:4px 12px;border-radius:var(--pill);font-weight:700;font-size:12px;
  letter-spacing:.5px;text-transform:uppercase}

/* footer / hint */
.player-foot{padding-top:10px}
.check-hint{text-align:center;font-size:11px;color:var(--ink-mute);margin-top:8px;font-weight:500;line-height:1.4}
.check-hint kbd{background:var(--color-polar);border:2px solid var(--color-swan);border-radius:6px;padding:0 5px;
  font-family:inherit;font-size:10px;font-weight:700;color:var(--color-ash)}

/* ---------- feedback sheet (kit) ---------- */
.feedback{
  position:fixed;left:0;right:0;bottom:0;z-index:55;transform:translateY(102%);
  transition:transform .4s cubic-bezier(0.34,1.56,0.64,1);
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.08);
  max-width:720px;margin:0 auto;
}
.feedback.show{transform:none}
.feedback.good{background:var(--color-eel-light);border-top:2px solid var(--color-lingot-lime)}
.feedback.bad{background:var(--red-pale);border-top:2px solid var(--color-cardinal)}
.feedback-head{display:flex;align-items:center;gap:16px;font-size:24px;font-weight:700;margin-bottom:8px}
.feedback.good .feedback-head{color:var(--color-ecto-green-dark)}
.feedback.bad .feedback-head{color:var(--color-cardinal-dark)}
.feedback .icon{width:36px;height:36px;border-radius:50%;background:var(--color-paper);display:grid;place-items:center;flex:0 0 auto}
.feedback.good .icon{color:var(--color-ecto-green-dark)}
.feedback.bad .icon{color:var(--color-cardinal-dark)}
.feedback p{font-size:17px;font-weight:500;color:var(--color-graphite);line-height:1.5;max-height:30vh;overflow:auto}
.feedback.good p{color:var(--color-ecto-green-dark)}
.feedback.bad p{color:var(--color-cardinal-dark)}
.feedback-foot{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.feedback .auto-note{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.7;text-align:center;order:2}
.feedback .btn{width:100%}
.feedback.bad .btn.btn-primary{background:var(--color-cardinal);box-shadow:0 4px 0 var(--color-cardinal-dark)}

/* ---------- results ---------- */
.results{align-items:center;justify-content:center;text-align:center;gap:14px}
.results h1{font-size:clamp(26px,6.4vw,34px);letter-spacing:-0.03em}
.results .sub{color:var(--color-ash);font-size:16px;font-weight:500;max-width:360px;line-height:1.45}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px;margin-top:8px}
.stat-card{
  background:var(--color-paper);border-radius:var(--radius-lg);padding:16px;
  border:2px solid var(--color-swan);box-shadow:0 4px 0 var(--color-swan);animation:cardUp .4s var(--spring) both;
}
@keyframes cardUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stat-card .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--color-graphite)}
.stat-card .l{font-size:11px;color:var(--color-ash);font-weight:700;text-transform:uppercase;letter-spacing:.9px;margin-top:4px}
.stat-card.green .v{color:var(--color-ecto-green-dark)}
.stat-card.purple .v{color:var(--color-macaw-blue)}
.stat-card.amber .v{color:var(--color-fox)}
.results .actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px;margin-top:8px}
.result-stars{display:flex;gap:6px;justify-content:center;align-items:center;color:var(--color-bee);animation:popIn .5s var(--spring) both}
.result-stars .off{opacity:.35;color:var(--color-swan)}

/* ---------- page head ---------- */
.page-head{display:flex;align-items:flex-start;align-self:stretch;gap:4px;margin:2px 0 18px}
.page-head .icon-btn{margin-top:2px;flex:0 0 auto}
.page-head h1{font-size:28px;line-height:1.14}
.page-head .tiny{font-size:14px;font-weight:500;line-height:1.4;color:var(--color-ash)}

/* ---------- practice ---------- */
.settings-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.settings-actions .btn{width:100%}
.practice-grid{display:grid;grid-template-columns:1fr;gap:16px}
.practice-card{
  display:flex;align-items:center;gap:16px;text-align:left;background:var(--color-paper);
  border:2px solid var(--color-swan);border-radius:var(--radius-lg);padding:16px;cursor:pointer;
  box-shadow:0 4px 0 var(--color-swan);transition:transform .15s cubic-bezier(0.34,1.56,0.64,1),box-shadow .15s,background .15s;
}
.practice-card:hover{transform:translateY(-4px);box-shadow:0 8px 0 var(--color-swan)}
.practice-card:active{transform:translateY(4px);box-shadow:none}
.practice-card .pc-icon{width:56px;height:56px;border-radius:var(--radius-md);display:grid;place-items:center;
  flex:0 0 auto;background:var(--color-eel-light);border:2px solid rgba(0,0,0,.03);color:var(--color-ecto-green-dark)}
.practice-card h3{font-size:18px;line-height:1.25}
.practice-card p{font-size:14px;color:var(--color-ash);font-weight:500;line-height:1.4;margin-top:2px}
.practice-card .pc-stat{margin-left:auto;font-weight:700;color:var(--color-ecto-green-dark);font-size:11px;
  letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;background:var(--color-polar);
  border:2px solid var(--color-swan);border-radius:var(--pill);padding:5px 10px}

/* ---------- profile ---------- */
.profile-head{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--color-eel-light);display:grid;place-items:center;
  border:2px solid var(--color-lingot-lime);flex:0 0 auto;color:var(--color-ecto-green-dark)}
.xpbar{height:16px;border-radius:var(--pill);background:var(--color-swan);overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;background:var(--color-ecto-green);border-radius:var(--pill);transition:width .6s var(--spring)}
.stat-line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;
  border-bottom:2px solid #f0f0f0;font-size:16px;font-weight:500;color:var(--color-ash)}
.stat-line:last-child{border-bottom:0}
.stat-line b{font-variant-numeric:tabular-nums;color:var(--color-graphite);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chart-wrap{position:relative;height:160px;margin-top:16px}
.chart-wrap canvas{width:100%;height:100%;display:block}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-mute);font-size:13px;text-align:center;font-weight:500}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.badge{aspect-ratio:1;border-radius:var(--radius-md);background:var(--color-polar);border:2px dashed var(--color-swan);
  display:grid;place-items:center;color:var(--color-ash);position:relative;padding-bottom:12px}
.badge.on{background:#fffbeb;border:2px solid var(--color-bee);color:var(--color-bee-dark);box-shadow:0 4px 0 rgba(255,200,0,.35)}
.badge small{position:absolute;bottom:5px;font-size:8px;font-weight:700;letter-spacing:.3px;color:inherit}

/* ---------- settings ---------- */
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:2px solid #f0f0f0}
.setting-row:last-child{border-bottom:0}
.setting-row .t{font-weight:700;font-size:16px;color:var(--color-graphite)}
.setting-row .d{font-size:13px;color:var(--color-ash);font-weight:500;margin-top:2px;line-height:1.4}
.switch{
  position:relative;width:56px;height:32px;border-radius:var(--pill);border:2px solid var(--color-swan);
  background:var(--color-swan);cursor:pointer;transition:background .18s ease,border-color .18s ease;flex:0 0 auto;padding:0;
}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:var(--color-paper);box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform .22s var(--spring)}
.switch[aria-checked="true"]{background:var(--color-ecto-green);border-color:var(--color-ecto-green-dark)}
.switch[aria-checked="true"]::after{transform:translateX(24px)}

/* ---------- modal (kit) ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:20px;z-index:80;animation:fadeIn .18s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--color-paper);border-radius:var(--radius-lg);padding:var(--spacing-xl);max-width:400px;width:100%;
  box-shadow:0 10px 40px rgba(0,0,0,.2);animation:modalIn .3s cubic-bezier(0.34,1.56,0.64,1) both;text-align:center}
@keyframes modalIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.modal h2{font-size:24px;font-weight:700;margin-bottom:8px}
.modal p{color:var(--color-ash);font-size:16px;font-weight:500;margin-bottom:24px;line-height:1.5}
.modal .actions{display:flex;flex-direction:column;gap:12px}
.modal .emoji{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;
  background:var(--color-eel-light);color:var(--color-ecto-green-dark)}
.modal .emoji .ico{width:32px;height:32px}

/* ---------- toast (kit) ---------- */
.toast-root{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;
  z-index:2000;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--color-graphite);color:var(--color-paper);padding:12px 24px;border-radius:var(--radius-md);
  font-size:14px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:toastIn .3s cubic-bezier(0.34,1.56,0.64,1) both;
  text-align:center;line-height:1.4}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ---------- xp ticker / confetti ---------- */
.xp-tick{position:fixed;font-weight:700;color:var(--color-bee);pointer-events:none;z-index:70;
  animation:xpFly 1s cubic-bezier(0.25,1,0.5,1) forwards;font-size:26px;letter-spacing:.4px;text-shadow:0 2px 0 var(--color-bee-dark)}
@keyframes xpFly{0%{opacity:0;transform:translateY(0) scale(.8)}20%{opacity:1;transform:translateY(-8px) scale(1.05)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:-1;width:100%;height:100%}
.results>*{position:relative;z-index:1}

/* ---------- shake / exercise states ---------- */
.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}16%{transform:translateX(-6px)}33%{transform:translateX(6px)}50%{transform:translateX(-5px)}66%{transform:translateX(5px)}83%{transform:translateX(-3px)}}
.exercise.bounce{animation:exBounce .42s var(--spring)}
@keyframes exBounce{0%{transform:scale(1)}28%{transform:scale(1.02)}62%{transform:scale(.998)}100%{transform:none}}
.exercise.flash-good{box-shadow:inset 0 0 0 3px rgba(88,204,2,.3);border-radius:var(--radius-lg)}
.exercise.flash-bad{box-shadow:inset 0 0 0 3px rgba(255,75,75,.35);border-radius:var(--radius-lg)}

/* ---------- bottom tabs ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--color-paper);
  border-top:2px solid var(--color-swan);display:flex;align-items:stretch;justify-content:space-around;
  gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;
  background:none;cursor:pointer;color:#afafaf;font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;padding:6px 2px;border-radius:var(--radius-md);transition:color .15s ease,background .15s ease;
}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:var(--color-polar)}
.tab.active{color:var(--color-macaw-blue)}
.tab.active svg{stroke:var(--color-macaw-blue)}
.tab:active{transform:scale(.96)}

/* ---------- misc ---------- */
.muted{color:var(--color-ash)}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:24px}
.grow{flex:1}
.divider{height:2px;background:var(--color-swan);margin:16px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--color-ash);font-weight:600}
.dotc{width:9px;height:9px;border-radius:50%}
:focus-visible{outline:none}
body.kbd :focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(28,176,246,.45)!important;border-radius:var(--radius-md)}

/* ---------- path: required practice pill ---------- */
.node-practice{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 16px;border-radius:var(--pill);
  background:var(--color-paper);border:2px solid var(--color-swan);box-shadow:0 3px 0 var(--color-swan);
  font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--color-ash);
  cursor:pointer;font-family:var(--font-main);transition:transform .12s var(--spring),box-shadow .12s,color .15s;
}
.node-practice:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--color-swan)}
.node-practice:active{transform:translateY(3px);box-shadow:none}
.node-practice .ico{width:13px;height:13px}
.node-practice.due{color:var(--color-macaw-blue);border-color:#bfe4fb;box-shadow:0 3px 0 #bfe4fb;background:var(--blue-pale)}
.node-practice.done{color:var(--color-ecto-green-dark);border-color:var(--color-lingot-lime);box-shadow:0 3px 0 var(--color-lingot-lime);background:var(--color-eel-light)}
.node-practice[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}

/* ---------- lesson sheet: missions + payout rules ---------- */
.missions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.mission{
  background:var(--color-polar);border:2px solid var(--color-swan);
  border-radius:var(--radius-md);padding:12px 4px;text-align:center;min-width:0;
}
.mission .m-ico{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;
  background:var(--color-paper);border:2px solid var(--color-swan);color:var(--color-ash);
}
.mission .m-ico .ico{width:18px;height:18px}
.mission b{display:block;font-size:11.5px;line-height:1.25;color:var(--color-graphite)}
.mission span{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--color-ash);margin-top:4px}
.mission.done{background:#f3fbea;border-color:var(--color-lingot-lime)}
.mission.done .m-ico{background:var(--color-eel-light);border-color:var(--color-lingot-lime);color:var(--color-ecto-green-dark)}
.mission.done span{color:var(--color-ecto-green-dark)}
.mission.locked .m-ico{background:var(--color-polar);color:#c9c9c9}

.payout{
  background:var(--color-polar);border:2px solid var(--color-swan);border-radius:var(--radius-md);
  padding:12px 14px;margin-top:14px;
}
.payout h4{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--color-ash);margin:0 0 8px}
.payout ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.payout li{display:flex;gap:8px;align-items:flex-start;font-size:12px;font-weight:600;color:var(--color-graphite);line-height:1.4}

<body>
<!-- ===== SCREENS ROOT ===== -->
<div class="app" id="app"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

<script>
/* ===== CONFIG ===== */
const CONFIG = {
  heartsMax: 5,
  heartsRefillMinutes: 15,
  xpPerLesson: 10,
  xpPerPractice: 0,
  xpPerBoss: 50,
  dailyXpCap: 300,
  dailyGemCap: 60,
  replayXpFactor: 0.25,
  firstClearGems: 10,
  pbGems: 5,
  practiceGate: 0.80,
  comboWindowMs: 3000,
  comboMaxMultiplier: 3,
  cpm: {
    dec2bin: [10, 20, 35, 50],
    bin2dec: [15, 25, 45, 60]
  },
  accuracyGate: 0.90,
  bossDurationSec: 60,
  flashItemMs: 1500,
  sessionItemCap: 20
};

/* ===== UTILITIES ===== */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const BITS = [128, 64, 32, 16, 8, 4, 2, 1];
const reduceQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const reducedMotion = () => !!(P && P.settings && P.settings.reducedMotion);

function toBin(n) { return (n & 255).toString(2).padStart(8, '0'); }
function fromBin(str) { let v = 0; for (let i = 0; i < 8; i++) if (str[i] === '1') v += BITS[i]; return v; }
function binToDec(bits) { let v = 0; for (const ch of String(bits)) v = v * 2 + (ch === '1' ? 1 : 0); return v; }
function dayKey(d) { const x = d || new Date(); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function daysBetween(a, b) {
  if (!a || !b) return Infinity;
  const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((p(b) - p(a)) / 86400000);
}
function levelFor(xp) { return Math.floor(Math.sqrt(Math.max(0, xp) / 25)) + 1; }
function xpForLevel(lv) { return Math.pow(lv - 1, 2) * 25; }
function fmtCpm(v) { return v == null ? '—' : (Math.round(v * 10) / 10).toFixed(1); }
function pct(v) { return (Math.round((v || 0) * 1000) / 10).toFixed(1) + '%'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === 'class') node.className = props[k];
    else if (k === 'html') node.innerHTML = props[k];
    else if (k === 'text') node.textContent = props[k];
    else if (k === 'style' && typeof props[k] === 'object') Object.assign(node.style, props[k]);
    else if (k.startsWith('on') && typeof props[k] === 'function') node.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if (k === 'dataset') Object.assign(node.dataset, props[k]);
    else if (props[k] != null && props[k] !== false) node.setAttribute(k, props[k]);
  }
  if (children != null) (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

/* greedy walk for dec -> bin */
function greedyWalk(n) {
  let rem = n; const kept = []; const skipped = [];
  BITS.forEach(v => { if (v <= rem) { kept.push(v); rem -= v; } else skipped.push(v); });
  const parts = [];
  let r = n;
  BITS.forEach(v => {
    if (v <= r) { parts.push(v + ' fits → remainder ' + (r - v)); r -= v; }
    else { parts.push(v + " doesn't fit"); }
  });
  return { steps: parts, answer: toBin(n), kept, skipped };
}
function greedyText(n) {
  const w = greedyWalk(n);
  return w.steps.join('. ') + '. Answer: ' + w.answer.split('').join(' ') + ' (' + n + ').';
}
function nibbleText(bits) {
  const b = String(bits).padStart(8, '0');
  const hi = b.slice(0, 4), lo = b.slice(4);
  const h = binToDec(hi), l = binToDec(lo);
  const hiVal = h * 16, loVal = l;
  return hi + ' (' + h + ') × 16 + ' + lo + ' (' + l + ') = ' + hiVal + ' + ' + loVal + ' = ' + (hiVal + loVal) + '.';
}
function bitsSpaced(bits) { return String(bits).split('').join(' '); }

/* ===== AUDIO ===== */
const AudioKit = {
  ctx: null, master: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.3;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  enabled() { return !!(P && P.settings && P.settings.sound); },
  tone(freq, dur, opts) {
    if (!this.ctx || !this.enabled()) return;
    opts = opts || {};
    const t0 = this.ctx.currentTime + (opts.delay || 0);
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, opts.slideTo), t0 + dur);
    const peak = opts.gain == null ? 0.5 : opts.gain;
    const attack = opts.attack == null ? 0.008 : opts.attack;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  },
  noise(dur, opts) {
    if (!this.ctx || !this.enabled()) return;
    opts = opts || {};
    const t0 = this.ctx.currentTime + (opts.delay || 0);
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = opts.cutoff || 500;
    const g = this.ctx.createGain(); g.gain.value = opts.gain == null ? 0.3 : opts.gain;
    src.connect(filter); filter.connect(g); g.connect(this.master);
    src.start(t0);
  },
  play(name) {
    if (!this.enabled()) return;
    this.init();
    if (!this.ctx) return;
    switch (name) {
      case 'toggleOn': this.tone(880, 0.09, { type: 'triangle', gain: 0.35 }); this.tone(1320, 0.1, { type: 'triangle', gain: 0.3, delay: 0.05 }); break;
      case 'toggleOff': this.tone(660, 0.09, { type: 'triangle', gain: 0.3 }); this.tone(440, 0.1, { type: 'triangle', gain: 0.25, delay: 0.05 }); break;
      case 'correct': this.tone(880, 0.12, { type: 'triangle', gain: 0.4 }); this.tone(1174.66, 0.18, { type: 'triangle', gain: 0.35, delay: 0.09 }); break;
      case 'wrong': this.tone(150, 0.22, { type: 'sine', gain: 0.5, slideTo: 90, attack: 0.005 }); this.noise(0.14, { cutoff: 380, gain: 0.18 }); break;
      case 'heartLoss': this.tone(330, 0.14, { type: 'sine', gain: 0.3, slideTo: 220 }); this.tone(196, 0.18, { type: 'sine', gain: 0.24, delay: 0.1 }); break;
      case 'xpGain': this.tone(740, 0.07, { type: 'square', gain: 0.18 }); this.tone(988, 0.09, { type: 'square', gain: 0.16, delay: 0.05 }); break;
      case 'levelUp': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.18, { type: 'triangle', gain: 0.32, delay: i * 0.09 })); break;
      case 'streakMilestone': [659.25, 880, 1046.5, 1318.5].forEach((f, i) => this.tone(f, 0.16, { type: 'sine', gain: 0.3, delay: i * 0.08 })); break;
      case 'lessonComplete': [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => this.tone(f, 0.24, { type: 'triangle', gain: 0.3, delay: i * 0.1 })); break;
      case 'bossStart': [440, 440, 660].forEach((f, i) => this.tone(f, 0.1, { type: 'square', gain: 0.22, delay: i * 0.16 })); break;
      case 'bossTick': this.tone(1200, 0.035, { type: 'square', gain: 0.1 }); break;
      case 'buttonPress': this.tone(300, 0.05, { type: 'sine', gain: 0.18 }); break;
      case 'comboUp': this.tone(700, 0.08, { type: 'triangle', gain: 0.26 }); this.tone(1050, 0.1, { type: 'triangle', gain: 0.22, delay: 0.06 }); break;
      default: break;
    }
  }
};
function haptic(ms) {
  if (P && P.settings && P.settings.haptics && navigator.vibrate) { try { navigator.vibrate(ms || 12); } catch (e) {} }
}

/* ===== STATE ===== */
const STORE_KEY = 'binaryTrainer.v1';

function defaultState() {
  return {
    xp: 0, level: 1, gems: 0, hearts: CONFIG.heartsMax, heartsRefilledAt: Date.now(),
    streak: { count: 0, lastDay: null, freeze: 0 },
    speedStreak: { count: 0, lastDay: null },
    lessons: {},
    srs: {},
    pbs: { dec2bin: null, bin2dec: null },
    settings: { sound: !reduceQuery.matches, haptics: true, reducedMotion: reduceQuery.matches },
    stats: { conversions: 0, correct: 0, attempts: 0, sessions: 0 },
    history: [],
    bossBest: null,
    flashBest: null,
    weakSessions: 0,
    daily: null
  };
}

function loadState() {
  const base = defaultState();
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return base;
    const saved = JSON.parse(raw);
    const merged = Object.assign({}, base, saved);
    merged.streak = Object.assign({}, base.streak, saved.streak || {});
    merged.speedStreak = Object.assign({}, base.speedStreak, saved.speedStreak || {});
    merged.settings = Object.assign({}, base.settings, saved.settings || {});
    merged.pbs = Object.assign({}, base.pbs, saved.pbs || {});
    merged.stats = Object.assign({}, base.stats, saved.stats || {});
    merged.lessons = saved.lessons || {};
    merged.srs = saved.srs || {};
    merged.history = Array.isArray(saved.history) ? saved.history : [];
    merged.daily = saved.daily || null;
    merged.level = levelFor(merged.xp);
    return merged;
  } catch (e) { return base; }
}

let saveTimer = null;
function save(immediate) {
  const write = () => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) {}
  };
  if (immediate) { clearTimeout(saveTimer); write(); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(write, 500);
}
window.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });
window.addEventListener('beforeunload', () => save(true));

let P = loadState();

/* hearts refill: 1 per heartsRefillMinutes */
function refillHearts() {
  if (P.hearts >= CONFIG.heartsMax) { P.heartsRefilledAt = Date.now(); return false; }
  const step = CONFIG.heartsRefillMinutes * 60000;
  if (!P.heartsRefilledAt) P.heartsRefilledAt = Date.now();
  const elapsed = Date.now() - P.heartsRefilledAt;
  const gained = Math.floor(elapsed / step);
  if (gained > 0) {
    P.hearts = Math.min(CONFIG.heartsMax, P.hearts + gained);
    P.heartsRefilledAt = P.hearts >= CONFIG.heartsMax ? Date.now() : P.heartsRefilledAt + gained * step;
    save();
    return true;
  }
  return false;
}
function nextHeartIn() {
  if (P.hearts >= CONFIG.heartsMax) return 0;
  const step = CONFIG.heartsRefillMinutes * 60000;
  const elapsed = Date.now() - (P.heartsRefilledAt || Date.now());
  return Math.max(0, step - (elapsed % step));
}
function fmtCountdown(ms) {
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
  return m + ':' + String(s).padStart(2, '0');
}
function spendHeart() {
  P.hearts = Math.max(0, P.hearts - 1);
  if (P.hearts === CONFIG.heartsMax - 1) P.heartsRefilledAt = Date.now();
  save();
}
function refillHeartsWithGems() {
  if (P.gems < 50) return false;
  P.gems -= 50;
  P.hearts = CONFIG.heartsMax;
  P.heartsRefilledAt = Date.now();
  save();
  return true;
}

function lessonState(id) {
  if (!P.lessons[id]) {
    P.lessons[id] = { stars: 0, bestCpm: null, bestAccuracy: null, completed: false, attempts: 0, lastPlayed: null, crown: false };
  }
  const st = P.lessons[id];
  if (st.practicePassed == null) st.practicePassed = false;
  if (st.practiceBest == null) st.practiceBest = null;
  if (st.paidClear == null) st.paidClear = false;
  return st;
}
function lessonIndex(id) { return LESSONS.findIndex(l => l.id === id); }
function isUnlocked(i) {
  if (i === 0) return true;
  const prev = P.lessons[LESSONS[i - 1].id];
  return !!(prev && prev.completed && prev.practicePassed);
}

/* ---------- reward rules ----------
   1. A lesson pays its full XP + gems only on the first clear.
   2. Replays pay 25% base XP and no gems; a new personal best pays 5 gems once per day.
   3. Practice / flash / weak pay answer XP only — no base XP, no gems.
   4. A boss run pays its base reward once per day.
   5. Everything is capped per day (XP and gems) so grinding the first lesson can't inflate progress.
*/
function dailyBucket() {
  const day = dayKey();
  if (!P.daily || P.daily.day !== day) P.daily = { day: day, xp: 0, gems: 0, modes: {}, gemDays: {} };
  if (!P.daily.modes) P.daily.modes = {};
  if (!P.daily.gemDays) P.daily.gemDays = {};
  return P.daily;
}
function capDailyXp(amount) {
  if (!amount || amount < 0) return 0;
  const d = dailyBucket();
  const left = Math.max(0, CONFIG.dailyXpCap - d.xp);
  const gain = Math.min(amount, left);
  d.xp += gain;
  return Math.round(gain);
}
function capDailyGems(amount, key) {
  if (!amount || amount < 0) return 0;
  const d = dailyBucket();
  const left = Math.max(0, CONFIG.dailyGemCap - d.gems);
  const gain = Math.min(amount, left);
  d.gems += gain;
  if (key) d.gemDays[key] = (d.gemDays[key] || 0) + gain;
  return gain;
}
function modePaidToday(mode) {
  const d = dailyBucket();
  return !!d.modes[mode];
}
function markModePaid(mode) {
  dailyBucket().modes[mode] = true;
}
function touchDailyStreak() {
  const today = dayKey();
  if (P.streak.lastDay === today) return false;
  if (P.streak.lastDay && daysBetween(P.streak.lastDay, today) === 1) {
    P.streak.count += 1;
  } else if (P.streak.lastDay && daysBetween(P.streak.lastDay, today) > 1 && P.streak.freeze > 0) {
    P.streak.freeze -= 1;
    P.streak.count += 1;
    toast('Streak freeze used — your streak is safe!');
  } else {
    P.streak.count = 1;
  }
  P.streak.lastDay = today;
  save();
  return true;
}
function awardXp(amount) {
  if (!amount) return { levelUp: false };
  const before = levelFor(P.xp);
  P.xp += amount;
  P.level = levelFor(P.xp);
  const after = P.level;
  save();
  return { levelUp: after > before, from: before, to: after };
}
function xpProgress() {
  const lv = levelFor(P.xp);
  const lo = xpForLevel(lv), hi = xpForLevel(lv + 1);
  return { lv, lo, hi, ratio: clamp((P.xp - lo) / (hi - lo), 0, 1) };
}
function recordHistory(entry) {
  P.history.push(Object.assign({ day: dayKey() }, entry));
  if (P.history.length > 400) P.history = P.history.slice(-400);
  save();
}
function pushToast(msg) {
  const root = document.getElementById('toast-root');
  const t = el('div', { class: 'toast', text: msg });
  root.appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .25s ease, transform .25s ease'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; }, 2400);
  setTimeout(() => t.remove(), 2750);
}

/* theory visual renderers */
function renderVisual(hint) {
  const h = String(hint || '').toLowerCase();
  const wrap = el('div', { class: 'vis-wrap' });
  if (/bulb|light/.test(h)) {
    const row = el('div', { class: 'vis-bulbs' });
    const vals = /eight|8 /.test(h) ? [128, 64, 32, 16, 8, 4, 2, 1] : [1, 2, 4, 8, 16];
    vals.forEach((v, i) => {
      const cell = el('div', { class: 'vis-bulb' }, [el('div', { class: 'globe' }), el('span', { text: String(v) })]);
      row.appendChild(cell);
      if (!reducedMotion()) {
        setTimeout(() => cell.classList.add('lit'), 250 + i * 260);
        setTimeout(() => cell.classList.remove('lit'), 1100 + i * 260);
        setTimeout(() => cell.classList.add('lit'), 1700 + i * 260);
      } else { cell.classList.add('lit'); }
    });
    wrap.appendChild(row);
    return wrap;
  }
  if (/table growing|doubling|arrows/.test(h)) {
    const t = el('div', { class: 'vis-table' });
    [['bits', 'patterns'], ['1', '2'], ['2', '4'], ['3', '8'], ['4', '16'], ['5', '32'], ['6', '64'], ['7', '128'], ['8', '256']].forEach((r, i) => {
      const row = el('div', { class: 'row' }, [el('span', { text: r[0] }), el('b', { text: r[1] })]);
      row.style.animationDelay = (i * 50) + 'ms';
      t.appendChild(row);
    });
    wrap.appendChild(t);
    return wrap;
  }
  if (/table of all 16|grid/.test(h)) {
    const g = el('div', { class: 'vis-grid' });
    for (let i = 0; i < 16; i++) {
      const d = el('div', { text: i.toString(2).padStart(4, '0') });
      d.style.animationDelay = (i * 35) + 'ms';
      g.appendChild(d);
    }
    wrap.appendChild(g);
    return wrap;
  }
  if (/split|halves/.test(h)) {
    wrap.appendChild(el('div', { class: 'vis-split' }, [el('span', { class: 'hi', text: '1011' }), el('span', { class: 'lo', text: '0100' })]));
    wrap.appendChild(el('div', { class: 'tiny muted mt2', text: 'high nibble × 16  +  low nibble' }));
    return wrap;
  }
  if (/division|remainders/.test(h)) {
    const d = el('div', { class: 'vis-div' });
    [['13 ÷ 2', '6', '1'], ['6 ÷ 2', '3', '0'], ['3 ÷ 2', '1', '1'], ['1 ÷ 2', '0', '1']].forEach((r, i) => {
      const row = el('span', { html: r[0] + ' = <b>' + r[1] + '</b> remainder <b>' + r[2] + '</b>' });
      row.style.animationDelay = (i * 60) + 'ms';
      d.appendChild(row);
    });
    wrap.appendChild(d);
    wrap.appendChild(el('div', { class: 'tiny muted mt2', text: 'read bottom-up → 1101' }));
    return wrap;
  }
  if (/race|compare/.test(h)) {
    const r = el('div', { class: 'vis-race' });
    r.appendChild(el('div', { class: 'lane' }, el('i')));
    r.appendChild(el('div', { class: 'lane win' }, el('i')));
    r.appendChild(el('div', { class: 'tiny muted', text: 'division … greedy ✓' }));
    wrap.appendChild(r);
    return wrap;
  }
  if (/stopwatch|timer|60 seconds/.test(h)) {
    wrap.appendChild(el('div', { class: 'vis-stopwatch pulse', text: '60.0' }));
    wrap.appendChild(el('div', { class: 'tiny muted mt2', text: 'seconds on the clock' }));
    return wrap;
  }
  if (/checklist|certificate/.test(h)) {
    const l = el('div', { class: 'vis-list' });
    ['Bits', 'Place values', 'Counting', 'Carries', 'Conversions'].forEach((t, i) => {
      const row = el('div', { html: '<span class="tick">✓</span> ' + t });
      row.style.animationDelay = (i * 90) + 'ms';
      l.appendChild(row);
    });
    wrap.appendChild(l);
    return wrap;
  }
  if (/chart|128|place values/.test(h)) {
    const c = el('div', { class: 'vis-chart' });
    BITS.forEach((v, i) => {
      const cell = el('div', { class: 'cell' }, [el('b', { text: '0' }), el('span', { text: String(v) })]);
      c.appendChild(cell);
      if (!reducedMotion()) setTimeout(() => cell.classList.add('lit'), 260 + i * 90);
      else cell.classList.add('lit');
    });
    wrap.appendChild(c);
    return wrap;
  }
  const b = el('div', { class: 'binchip' });
  '10110100'.split('').forEach((bit, i) => {
    const s = el('span', { class: bit === '1' ? 'one' : '', text: bit });
    s.style.animationDelay = (i * 60) + 'ms';
    b.appendChild(s);
  });
  wrap.appendChild(b);
  return wrap;
}

function openModal(cfg) {
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  const backdrop = el('div', { class: 'modal-backdrop', role: 'dialog', 'aria-modal': 'true', 'aria-label': cfg.title || 'Dialog' });
  const box = el('div', { class: 'modal' });
  if (cfg.emoji) box.appendChild(el('div', { class: 'emoji', html: cfg.emoji }));
  if (cfg.title) box.appendChild(el('h2', { text: cfg.title }));
  if (cfg.body) box.appendChild(el('p', { text: cfg.body }));
  const actions = el('div', { class: 'actions' });
  (cfg.actions || [{ label: 'OK', variant: 'primary' }]).forEach(a => {
    actions.appendChild(el('button', {
      class: 'btn ' + (a.variant === 'secondary' ? 'btn-secondary' : a.variant === 'danger' ? 'btn-danger' : a.variant === 'ghost' ? 'btn-ghost' : 'btn-primary'),
      text: a.label,
      type: 'button',
      onclick: () => { close(); if (a.onClick) a.onClick(); }
    }));
  });
  box.appendChild(actions);
  backdrop.appendChild(box);
  root.appendChild(backdrop);
  function close() { root.innerHTML = ''; document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(); if (cfg.onClose) cfg.onClose(); } }

  backdrop.addEventListener('click', e => { if (e.target === backdrop && cfg.dismissible !== false) close(); });

  if (first) first.focus();

/* ---------- hearts: water-fill timer modal ---------- */
function openHeartsModal() {
  refillHearts();
  AudioKit.play('buttonPress');
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  const backdrop = el('div', { class: 'modal-backdrop' });
  const box = el('div', { class: 'modal hearts-modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Hearts and refill timer' });
  box.appendChild(el('h2', { text: 'Hearts' }));
  const tanks = el('div', { class: 'heart-tanks' });
  box.appendChild(tanks);
  const timer = el('div', { class: 'heart-timer-big' });
  const timerLabel = el('div', { class: 'heart-timer-label', text: 'until your next heart' });
  box.appendChild(timer);
  box.appendChild(timerLabel);
  const note = el('p', { class: 'always', text: 'One heart every ' + CONFIG.heartsRefillMinutes + ' minutes. Practice sessions never cost hearts. You have ' + P.gems + ' gems.' });
  box.appendChild(note);

  const step = CONFIG.heartsRefillMinutes * 60000;
  const HP = 'M12 20.4S3.6 15 3.6 9.3A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.4 3.1c0 5.7-8.4 11.1-8.4 11.1z';
  function paintTanks() {
    const remain = nextHeartIn();
    const progress = P.hearts >= CONFIG.heartsMax ? 1 : clamp(1 - remain / step, 0, 1);
    let out = '';
    for (let i = 0; i < CONFIG.heartsMax; i++) {
      const full = i < P.hearts;
      const next = i === P.hearts;
      const clip = 'hclip' + i;
      let inner = '<path class="shell" d="' + HP + '"/>';
      if (next) {
        const top = 24 - 24 * progress;
        inner += '<defs><clipPath id="' + clip + '"><path d="' + HP + '"/></clipPath></defs>' +
          '<g clip-path="url(#' + clip + ')">' +
          '<rect class="water" x="-1" y="' + top.toFixed(2) + '" width="26" height="26"/>' +
          '<path class="wave" d="M-1 ' + top.toFixed(2) + ' q3 -1.3 6 0 t6 0 t6 0 t6 0 V26 H-1 Z"/>' +
          '</g>';
      }
      if (full) inner += '<path class="shine" d="M8.6 8.6c1-1 2.4-1.4 3.4-1" transform="translate(-.6 -.6)"/>';
      out += '<div class="heart-tank ' + (full ? 'full' : next ? 'next' : 'empty') + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + inner + '</svg></div>';
    }
    tanks.innerHTML = out;
    if (P.hearts >= CONFIG.heartsMax) {
      timer.textContent = 'Full';
      timerLabel.textContent = 'all hearts ready';
    } else {
      timer.textContent = fmtCountdown(remain);
      timerLabel.textContent = 'until your next heart';
    }
  }
  paintTanks();

  const actions = el('div', { class: 'actions' });
  actions.appendChild(el('button', {
    class: 'btn ' + (P.gems >= 50 ? 'btn-primary' : 'btn-secondary'), type: 'button',
    text: 'Refill · 50 gems',
    onclick: () => {
      if (!refillHeartsWithGems()) { toast('Not enough gems — practice is always free'); return; }
      AudioKit.play('levelUp');
      toast('Hearts refilled');
      close();
      if (currentScreenName === 'home' || currentScreenName === 'practice' || currentScreenName === 'profile') renderScreen(currentScreenName, {}, 'none');
    }
  }));
  actions.appendChild(el('button', {
    class: 'btn btn-secondary', type: 'button', text: 'Practice without hearts',
    onclick: () => { close(); if (currentScreenName !== 'practice') navigate('practice'); }
  }));
  actions.appendChild(el('button', { class: 'btn btn-ghost', type: 'button', text: 'Close', onclick: () => close() }));
  box.appendChild(actions);
  backdrop.appendChild(box);
  root.appendChild(backdrop);

  const tick = setInterval(() => {
    if (!document.body.contains(box)) { clearInterval(tick); return; }
    refillHearts();
    paintTanks();
    if (P.hearts >= CONFIG.heartsMax) setTimeout(() => close(), 900);
  }, 1000);

  function close() {
    clearInterval(tick);
    root.innerHTML = '';
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(); } }
  document.addEventListener('keydown', onKey);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
  const first = box.querySelector('.btn');
  if (first) first.focus();
}

/* confetti */
let confettiRaf = null;
function confettiBurst(count) {
  const canvas = document.getElementById('confetti');
  if (!canvas || reducedMotion()) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#22C55E', '#06B6D4', '#F59E0B', '#A855F7', '#EF4444', '#3B82F6'];
  const parts = [];
  const n = count || 90;
  for (let i = 0; i < n; i++) {
    parts.push({
      x: window.innerWidth / 2 + (Math.random() - 0.5) * 150,
      y: window.innerHeight * 0.34 + (Math.random() - 0.5) * 60,
      vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 9 - 3,
      size: 5 + Math.random() * 7,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, life: 1
    });
  }
  if (confettiRaf) cancelAnimationFrame(confettiRaf);
  const start = performance.now();
  function frame(t) {
    const elapsed = t - start;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    let alive = false;
    parts.forEach(p => {
      p.vy += 0.28; p.x += p.vx; p.y += p.vy; p.vx *= 0.995; p.rot += p.vr; p.life -= 0.011;
      if (p.y < window.innerHeight + 40 && p.life > 0) alive = true;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    if (alive && elapsed < 2400) confettiRaf = requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); confettiRaf = null; }
  }
  confettiRaf = requestAnimationFrame(frame);
}

function animateCount(node, to, ms) {
  if (!node) return;
  const target = Math.max(0, Math.round(to));
  if (reducedMotion() || !target) { node.textContent = String(target); return; }
  const start = performance.now();
  const dur = ms || 500;
  function step(now) {
    const t = clamp((now - start) / dur, 0, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    node.textContent = String(Math.round(target * eased));
    if (t < 1 && node.isConnected) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function flyXp(amount, fromEl) {
  if (reducedMotion() || !fromEl) return;
  const r = fromEl.getBoundingClientRect();
  const n = el('div', { class: 'xp-tick', text: '+' + amount + ' XP' });
  n.style.left = (r.left + r.width / 2 - 30) + 'px';
  n.style.top = (r.top - 10) + 'px';
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 1100);
}

/* ===== NAVIGATION ===== */
let currentScreenName = 'home';

function renderScreen(name, params, dir) {
  const node = SCREENS[name](params || {});
  if (!node) return;
  node.classList.add('screen');
  const tabbed = ['home', 'practice', 'profile', 'settings'].indexOf(name) !== -1;
  if (tabbed) node.classList.add('has-tabs');
  if (dir === 'back') node.classList.add('from-left');
  else if (dir === 'forward') node.classList.add('from-right');
  app.replaceChildren(node);
  currentScreenName = name;
  const bar = document.getElementById('tabbar');
  if (bar) {
    bar.style.display = tabbed ? '' : 'none';
    Array.from(bar.querySelectorAll('.tab')).forEach(t => {
      const on = t.getAttribute('data-screen') === name;
      t.classList.toggle('active', on);
      if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
  }
  window.scrollTo(0, 0);
}
function closeOverlays() {
  const mr = document.getElementById('modal-root');
  if (mr) mr.innerHTML = '';
}
function navigate(name, params, opts) {
  opts = opts || {};
  closeOverlays();
  stopAllTimers();
  navHistory.push({ name, params: params || {} });
  renderScreen(name, params || {}, opts.back ? 'back' : 'forward');
  AudioKit.play('buttonPress');
}
function goHome() {
  closeOverlays();
  stopAllTimers();
  navHistory = [{ name: 'home', params: {} }];
  renderScreen('home', {}, 'back');
}
function stopAllTimers() {
  if (typeof Player !== 'undefined' && Player) Player.stop();
}
