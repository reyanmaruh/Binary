/* dashed serpentine connector behind the lesson nodes */
function drawPathLines(scope) {
  const root = scope || document;
  root.querySelectorAll('.path').forEach(p => {
    p.querySelectorAll('.path-line').forEach(n => n.remove());
    p.classList.remove('has-line');
    const wraps = Array.prototype.slice.call(p.querySelectorAll('.node-wrap'));
    if (wraps.length < 2) return;
    const pr = p.getBoundingClientRect();
    wraps.forEach(w => { w.style.animation = 'none'; });
    const pts = wraps.map(w => {
      const node = w.querySelector('.node-card');
      const r = node.getBoundingClientRect();
      return { x: r.left - pr.left + r.width / 2, y: r.top - pr.top + r.height / 2 };
    });
    wraps.forEach(w => { w.style.animation = ''; });
    let d = 'M' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], my = (a.y + b.y) / 2;
      d += ' C' + a.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
    }
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'path-line');
    svg.setAttribute('viewBox', '0 0 ' + p.clientWidth + ' ' + p.scrollHeight);
    svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = '<path d="' + d + '"/>';
    p.insertBefore(svg, p.firstChild);
    p.classList.add('has-line');
  });
}

/* ===== EXERCISE RENDERERS ===== */
function bitSum(bits) {
  let v = 0;
  for (let i = 0; i < 8; i++) if (bits[i]) v += BITS[i];
  return v;
}
function bitString(bits) { return bits.map(b => (b ? '1' : '0')).join(''); }

function bitsWidget(cfg) {
  const bits = (cfg.bits || [0, 0, 0, 0, 0, 0, 0, 0]).slice();
  const show = cfg.showLabels !== false;
  const row = el('div', { class: 'bits', role: 'group', 'aria-label': 'Eight bit switches, leftmost is 128' });
  const cells = [];
  BITS.forEach((v, i) => {
    const place = el('div', { class: 'place' + (show ? '' : ' hidden'), text: String(v) });
    const btn = el('button', {
      class: 'bit', type: 'button', 'aria-pressed': 'false',
      'aria-label': 'Bit worth ' + v + ', currently off',
      onclick: () => toggle(i)
    }, String(bits[i]));
    const cell = el('div', { class: 'bit-cell' }, [place, btn]);
    row.appendChild(cell);
    cells.push({ place, btn, cell });
  });
  function paint(animate) {
    cells.forEach((c, i) => {
      c.btn.textContent = String(bits[i]);
      c.btn.setAttribute('aria-pressed', bits[i] ? 'true' : 'false');
      c.btn.setAttribute('aria-label', 'Bit worth ' + BITS[i] + ', currently ' + (bits[i] ? 'on' : 'off'));
      c.place.classList.toggle('on', !!bits[i]);
      if (animate) {
        c.btn.classList.remove('flip');
        void c.btn.offsetWidth;
        c.btn.classList.add('flip');
      }
    });
    if (cfg.onChange) cfg.onChange(bitSum(bits), bitString(bits));
  }
  function toggle(i) {
    bits[i] = bits[i] ? 0 : 1;
    paint(true);
    AudioKit.play(bits[i] ? 'toggleOn' : 'toggleOff');
    haptic(8);
  }
  function onKey(e) {
    if (e.key >= '1' && e.key <= '8') {
      e.preventDefault();
      toggle(Number(e.key) - 1);
    }
  }
  paint(false);
  return {
    el: row,
    bits,
    toggle,
    onKey,
    get value() { return bitSum(bits); },
    get str() { return bitString(bits); },
    setLabels(v) { cells.forEach(c => c.place.classList.toggle('hidden', !v)); },
    flashWrong() { row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); cells.forEach(c => c.btn.classList.add('wrong')); setTimeout(() => cells.forEach(c => c.btn.classList.remove('wrong')), 420); },
    destroy() {}
  };
}

function exTAP(ex, opts) {
  const target = typeof ex.value === 'number' ? ex.value : fromBin(ex.correct || '0');
  const showChart = ex.showChart !== false;
  const wrap = el('div', { class: 'tap-ex' });
  wrap.appendChild(promptBlock('Decimal → Binary', '<span class="target">' + target + '</span>', 'Flip the switches so they add up to ' + target + '.'));

  const summary = el('div', { class: 'sum', html: 'Sum: <b>0</b>' });
  const w = bitsWidget({
    showLabels: showChart,
    onChange: (v) => { summary.innerHTML = 'Sum: <b class="pop">' + v + '</b>'; }
  });
  wrap.appendChild(w.el);
  wrap.appendChild(summary);

  if (!showChart) {
    let peeked = false;
    const peek = el('button', {
      class: 'btn btn-ghost btn-sm chart-toggle', type: 'button', html: icon('eye') + ' Peek at the chart (once)',
      onclick: () => {
        if (peeked) return;
        peeked = true;
        w.setLabels(true);
        peek.textContent = 'Chart shown — this one only';
        peek.disabled = true;
        AudioKit.play('buttonPress');
      }
    });
    wrap.appendChild(peek);
  }
  if (ex.showHints) {
    const hint = el('div', { class: 'tiny muted mt2', style: { textAlign: 'center' } });
    wrap.appendChild(el('button', {
      class: 'btn btn-ghost btn-sm chart-toggle', type: 'button', html: icon('bulb') + ' Hint: greedy walk',
      onclick: (e) => { hint.textContent = greedyText(target); e.currentTarget.disabled = true; }
    }));
    wrap.appendChild(hint);
  }
  document.addEventListener('keydown', w.onKey);
  return {
    el: wrap,
    auto: false,
    ready: () => true,
    check: () => {
      const ok = w.value === target;
      if (ok) {
        return { correct: true, explanation: toBin(target) + ' = ' + (BITS.filter((v, i) => w.bits[i]).join(' + ') || '0') + '.' };
      }
      w.flashWrong();
      return { correct: false, explanation: greedyText(target) };
    },
    focus: () => { const b = w.el.querySelector('.bit'); if (b) b.focus({ preventScroll: true }); },
    destroy: () => document.removeEventListener('keydown', w.onKey)
  };
}

function exNUM(ex, opts) {
  const bits = String(ex.bits).padStart(8, '0');
  const target = binToDec(bits);
  const targetStr = String(target);
  const wrap = el('div', { class: 'num-ex' });
  wrap.appendChild(promptBlock('Binary → Decimal', '<span class="binchip">' + bits.split('').map(b => '<span class="' + (b === '1' ? 'one' : '') + '">' + b + '</span>').join('') + '</span>', 'Type the decimal value.'));

  if (ex.showChart) {
    const chartRow = el('div', { class: 'vis-chart' });
    BITS.forEach((v, i) => {
      const lit = bits[i] === '1';
      chartRow.appendChild(el('div', { class: 'cell ' + (lit ? 'lit' : '') }, [el('b', { text: bits[i] }), el('span', { text: String(v) })]));
    });
    wrap.appendChild(chartRow);
  }

  let digits = [];
  const display = el('div', { class: 'num-display', 'aria-live': 'polite' });
  const keypad = el('div', { class: 'keypad', role: 'group', 'aria-label': 'Number pad' });

  function paintDisplay() {
    display.innerHTML = '';
    digits.forEach(d => display.appendChild(el('div', { class: 'num-digit', text: d })));
    const remaining = Math.max(0, targetStr.length - digits.length);
    for (let i = 0; i < remaining; i++) display.appendChild(el('div', { class: 'num-ghost' }));
    if (!digits.length) display.appendChild(el('div', { class: 'num-ghost' }));
  }
  function press(d) {
    if (digits.length >= 4) return;
    digits.push(d);
    paintDisplay();
    AudioKit.play('buttonPress');
    haptic(6);
    if (ex.autoSubmit && digits.length === targetStr.length && opts.onAutoSubmit) opts.onAutoSubmit();
  }
  function back() { if (!digits.length) return; digits.pop(); paintDisplay(); AudioKit.play('toggleOff'); }
  function clear() { digits = []; paintDisplay(); AudioKit.play('toggleOff'); }
  ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach(n => keypad.appendChild(el('button', { type: 'button', text: n, 'aria-label': 'Key ' + n, onclick: () => press(n) })));
  keypad.appendChild(el('button', { type: 'button', class: 'wide', html: icon('backspace'), 'aria-label': 'Backspace', onclick: back }));
  keypad.appendChild(el('button', { type: 'button', text: '0', 'aria-label': 'Key 0', onclick: () => press('0') }));
  keypad.appendChild(el('button', { type: 'button', class: 'enter wide', html: icon('check'), 'aria-label': 'Submit answer', onclick: () => { if (digits.length && opts.onAutoSubmit) opts.onAutoSubmit(); } }));
  wrap.appendChild(display);
  wrap.appendChild(keypad);
  paintDisplay();

  function onKey(e) {
    if (e.key >= '0' && e.key <= '9') { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); back(); }
    else if (e.key === 'Delete') { e.preventDefault(); clear(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (digits.length && opts.onAutoSubmit) opts.onAutoSubmit(); }
  }
  document.addEventListener('keydown', onKey);
  return {
    el: wrap,
    auto: true,
    ready: () => digits.length > 0,
    check: () => {
      const val = Number(digits.join('')) || 0;
      if (val === target) {
        const on = [];
        for (let i = 0; i < 8; i++) if (bits[i] === '1') on.push(BITS[i]);
        return { correct: true, explanation: bits + ' = ' + (on.join(' + ') || '0') + ' = ' + target + '.' };
      }
      return { correct: false, explanation: bits + ' = ' + nibbleText(bits) };
    },
    focus: () => { const b = keypad.querySelector('button'); if (b) b.focus({ preventScroll: true }); },
    destroy: () => document.removeEventListener('keydown', onKey)
  };
}

function exMCQ(ex) {
  const wrap = el('div', { class: 'mcq-ex' });
  wrap.appendChild(promptBlock('Question', esc(ex.prompt), ''));
  const list = el('div', { class: 'mcq', role: 'group', 'aria-label': 'Answer choices' });
  let selected = -1;
  const buttons = [];
  ex.options.forEach((opt, i) => {
    const b = el('button', {
      class: 'mcq-opt', type: 'button', 'aria-pressed': 'false',
      onclick: () => select(i)
    }, [el('span', { class: 'key', text: String.fromCharCode(65 + i) }), el('span', { text: opt })]);
    buttons.push(b);
    list.appendChild(b);
  });
  function select(i) {
    selected = i;
    buttons.forEach((b, j) => b.setAttribute('aria-pressed', j === i ? 'true' : 'false'));
    AudioKit.play('buttonPress');
    haptic(8);
  }
  function onKey(e) {
    if (e.key >= '1' && e.key <= '4' && Number(e.key) <= ex.options.length) { e.preventDefault(); select(Number(e.key) - 1); }
  }
  document.addEventListener('keydown', onKey);
  wrap.appendChild(list);
  return {
    el: wrap,
    auto: false,
    ready: () => selected >= 0,
    check: () => {
      const ok = selected === ex.answer;
      buttons.forEach((b, i) => {
        if (i === ex.answer) b.classList.add('correct');
        else if (i === selected) b.classList.add('wrong');
      });
      if (ok) return { correct: true, explanation: 'Yes — ' + ex.options[ex.answer] + '.' };
      return { correct: false, explanation: 'The answer is “' + ex.options[ex.answer] + '”. ' + (selected >= 0 ? 'You chose “' + ex.options[selected] + '”.' : '') };
    },
    focus: () => { if (buttons[0]) buttons[0].focus({ preventScroll: true }); },
    destroy: () => document.removeEventListener('keydown', onKey)
  };
}

function exBLANK(ex) {
  const known = ex.known;
  const blanks = [];
  for (let i = 0; i < known.length; i++) if (known[i] === '_') blanks.push(i);
  const wrap = el('div', { class: 'blank-ex' });
  wrap.appendChild(promptBlock('Fill the blanks', '<span class="target">' + ex.value + '</span>', 'Complete the binary answer.'));
  const row = el('div', { class: 'blank-row', role: 'group', 'aria-label': 'Binary answer with ' + blanks.length + ' blanks' });
  const inputs = [];
  for (let i = 0; i < known.length; i++) {
    if (known[i] === '_') {
      const inp = el('input', {
        class: 'blank-cell fill', inputmode: 'numeric', maxlength: '1', 'aria-label': 'Blank digit ' + (inputs.length + 1),
        style: { textAlign: 'center', fontWeight: '800' }
      });
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/[^01]/g, '').slice(0, 1);
        if (inp.value && inputs[inputs.length - 1] !== inp) {
          const next = inputs[inputs.indexOf(inp) + 1];
          if (next) next.focus();
        }
        AudioKit.play('buttonPress');
      });
      inputs.push(inp);
      row.appendChild(inp);
    } else {
      row.appendChild(el('div', { class: 'blank-cell given', text: known[i] }));
    }
  }
  wrap.appendChild(row);
  wrap.appendChild(el('div', { class: 'tiny muted mt2', style: { textAlign: 'center' }, text: 'Type 0 or 1 into each blank.' }));
  return {
    el: wrap,
    auto: false,
    ready: () => inputs.every(i => i.value.length === 1),
    check: () => {
      const filled = inputs.map(i => i.value).join('');
      const full = known.split('').map((c, idx) => {
        if (c !== '_') return c;
        return null;
      });
      let bi = 0;
      const result = full.map(c => (c === null ? filled[bi++] : c)).join('');
      if (filled === ex.answer && result === toBin(ex.value)) {
        return { correct: true, explanation: toBin(ex.value) + ' = ' + ex.value + '.' };
      }
      inputs.forEach(i => i.classList.add('shake'));
      setTimeout(() => inputs.forEach(i => i.classList.remove('shake')), 340);
      return { correct: false, explanation: 'Correct answer: ' + toBin(ex.value).split('').join(' ') + ' — the blanks are “' + ex.answer + '”. ' + greedyText(ex.value) };
    },
    focus: () => { if (inputs[0]) inputs[0].focus({ preventScroll: true }); },
    destroy: () => {}
  };
}

function exORDER(ex) {
  const wrap = el('div', { class: 'order-ex' });
  wrap.appendChild(promptBlock('Put them in order', 'Smallest → largest', 'Tap the values in order.'));
  const slots = el('div', { class: 'order-slots', 'aria-label': 'Your order' });
  const bank = el('div', { class: 'order-bank', 'aria-label': 'Available values' });
  const chosen = [];
  const chipFor = (val, sourceIdx) => {
    const b = el('button', { class: 'chip-item', type: 'button', text: val, 'aria-label': 'Value ' + val });
    b.addEventListener('click', () => {
      if (b.classList.contains('placed')) {
        const pos = chosen.findIndex(c => c.el === b);
        if (pos >= 0) { chosen.splice(pos, 1); b.classList.remove('placed'); bank.appendChild(b); AudioKit.play('toggleOff'); repaint(); }
      } else {
        b.classList.add('placed');
        slots.appendChild(b);
        chosen.push({ val, el: b });
        AudioKit.play('toggleOn'); haptic(8);
        repaint();
      }
    });
    return b;
  };
  function repaint() {
    Array.from(bank.children).forEach(c => c.classList.remove('dim'));
    chosen.forEach(c => {});
  }
  shuffle(ex.items).forEach(v => bank.appendChild(chipFor(v)));
  wrap.appendChild(slots);
  wrap.appendChild(el('div', { class: 'tiny muted mt2', style: { textAlign: 'center' }, text: 'Tap a placed value to send it back.' }));
  wrap.appendChild(bank);
  return {
    el: wrap,
    auto: false,
    ready: () => chosen.length === ex.correctOrder.length,
    check: () => {
      const seq = chosen.map(c => c.val);
      if (seq.join('|') === ex.correctOrder.join('|')) {
        return { correct: true, explanation: 'Correct order: ' + ex.correctOrder.join(' → ') + '.' };
      }
      return { correct: false, explanation: 'Correct order: ' + ex.correctOrder.join(' → ') + '. You had: ' + (seq.join(' → ') || 'nothing yet') + '.' };
    },
    focus: () => { const b = bank.querySelector('button'); if (b) b.focus({ preventScroll: true }); },
    destroy: () => {}
  };
}

function exMATCH(ex, opts) {
  const wrap = el('div', { class: 'match-ex' });
  wrap.appendChild(promptBlock('Match the pairs', 'Tap a left card, then its partner', ''));
  const grid = el('div', { class: 'match' });
  const leftCol = el('div', { class: 'match-col', 'aria-label': 'Binary values' });
  const rightCol = el('div', { class: 'match-col', 'aria-label': 'Decimal values' });
  const left = ex.pairs.map(p => ({ text: p[0], done: false, el: null }));
  const right = shuffle(ex.pairs.map(p => ({ text: p[1], key: p[0], done: false, el: null })));
  let selLeft = null;
  let matched = 0;
  let mistakes = 0;
  left.forEach(item => {
    const b = el('button', {
      class: 'match-item', type: 'button', text: item.text,
      onclick: () => {
        if (item.done) return;
        left.forEach(l => { if (l.el) l.el.classList.remove('sel'); });
        item.el.classList.add('sel');
        selLeft = item;
        AudioKit.play('buttonPress');
      }
    });
    item.el = b;
    leftCol.appendChild(b);
  });
  right.forEach(item => {
    const b = el('button', {
      class: 'match-item', type: 'button', text: item.text,
      onclick: () => {
        if (item.done || !selLeft) { if (!selLeft) toast('Pick a card on the left first'); return; }
        if (selLeft.text === item.key) {
          item.done = true; selLeft.done = true;
          b.classList.add('done'); selLeft.el.classList.add('done');
          b.classList.remove('sel'); selLeft.el.classList.remove('sel');
          AudioKit.play('correct');
          matched += 1;
          selLeft = null;
          if (matched === left.length) {
            setTimeout(() => opts.onSolved(mistakes === 0
              ? 'Perfect match — all ' + left.length + ' pairs.'
              : 'All ' + left.length + ' pairs matched, with ' + mistakes + ' slip' + (mistakes === 1 ? '' : 's') + '.'), 260);
          }
        } else {
          mistakes += 1;
          b.classList.add('bad'); selLeft.el.classList.add('bad');
          AudioKit.play('wrong');
          setTimeout(() => { b.classList.remove('bad'); if (selLeft) selLeft.el.classList.remove('bad', 'sel'); }, 380);
          opts.onMistake(selLeft.text + ' does not pair with ' + item.text + '. Look again — re-showing the pair.');
          selLeft = null;
        }
      }
    });
    item.el = b;
    rightCol.appendChild(b);
  });
  grid.appendChild(leftCol);
  grid.appendChild(rightCol);
  wrap.appendChild(grid);
  return {
    el: wrap,
    auto: true,
    ready: () => false,
    check: () => null,
    focus: () => { const b = leftCol.querySelector('button'); if (b) b.focus({ preventScroll: true }); },
    destroy: () => {}
  };
}

function exSPOT(ex) {
  const shown = String(ex.shown).padStart(8, '0');
  const correct = toBin(ex.value);
  const wrongIdx = ex.wrongBitIndex;
  const wrap = el('div', { class: 'spot' });
  wrap.appendChild(promptBlock('Find the wrong bit', '<span class="target">' + ex.value + '</span>', 'One bit is wrong. Tap it.'));
  const row = el('div', { class: 'bits', role: 'group', 'aria-label': 'Eight shown bits; tap the incorrect one' });
  let selected = null;
  const cells = [];
  shown.split('').forEach((bit, i) => {
    const place = el('div', { class: 'place', text: String(BITS[i]) });
    const btn = el('button', {
      class: 'bit', type: 'button', 'aria-pressed': 'false',
      'aria-label': 'Bit worth ' + BITS[i] + ' is ' + bit,
      onclick: () => {
        row.querySelectorAll('.bit').forEach(b => b.setAttribute('aria-pressed', 'false'));
        btn.setAttribute('aria-pressed', 'true');
        selected = i;
        AudioKit.play('buttonPress');
        haptic(8);
      }
    }, bit);
    cells.push({ place, btn });
    row.appendChild(el('div', { class: 'bit-cell' }, [place, btn]));
  });
  wrap.appendChild(row);
  wrap.appendChild(el('div', { class: 'spot-hint tiny muted mt3', text: 'Correct answer: ' + correct.split('').join(' ') }));
  return {
    el: wrap,
    auto: false,
    ready: () => selected !== null,
    check: () => {
      const chosenFromRight = selected === null ? null : 7 - selected;
      if (chosenFromRight === wrongIdx) {
        cells.forEach((c, i) => {
          const isWrong = (7 - i) === wrongIdx;
          c.btn.classList.toggle('wrong', isWrong);
        });
        return { correct: true, explanation: 'That bit should be ' + correct[selected] + '. ' + correct.split('').join(' ') + ' = ' + ex.value + '.' };
      }
      const actualIdx = 7 - wrongIdx;
      cells.forEach((c, i) => {
        c.btn.classList.toggle('wrong', i === actualIdx);
        c.btn.classList.toggle('flip', i === selected);
      });
      return { correct: false, explanation: 'The wrong bit is the one worth ' + BITS[actualIdx] + ' (highlighted): it shows ' + shown[actualIdx] + ' but should be ' + correct[actualIdx] + '. ' + correct.split('').join(' ') + ' = ' + ex.value + '.' };
    },
    focus: () => { const b = row.querySelector('.bit'); if (b) b.focus({ preventScroll: true }); },
    destroy: () => {}
  };
}

function makeRandomItem(pool, max) {
  const dir = pool === 'mixed' ? (Math.random() < 0.5 ? 'dec2bin' : 'bin2dec') : (pool || 'dec2bin');
  if (dir === 'bin2dec') {
    const v = randInt(0, max == null ? 255 : max);
    return { type: 'NUM', direction: 'bin2dec', bits: toBin(v), showChart: false, autoSubmit: true, _v: v };
  }
  const v = randInt(0, max == null ? 255 : max);
  return { type: 'TAP', direction: 'dec2bin', value: v, showChart: false, showHints: false };
}

function renderExercise(ex, opts) {
  opts = opts || {};
  switch (ex.type) {
    case 'TAP': return exTAP(ex, opts);
    case 'NUM': return exNUM(ex, opts);
    case 'MCQ': return exMCQ(ex, opts);
    case 'BLANK': return exBLANK(ex, opts);
    case 'ORDER': return exORDER(ex, opts);
    case 'MATCH': return exMATCH(ex, opts);
    case 'SPOT': return exSPOT(ex, opts);
    case 'FLASH': {
      const dir = ex.direction || 'bin2dec';
      if (dir === 'bin2dec') return exNUM({ type: 'NUM', bits: ex.bits, showChart: false, autoSubmit: true }, opts);
      return exTAP({ type: 'TAP', value: ex.value, showChart: false, showHints: false }, opts);
    }
    default:
      return exTAP({ type: 'TAP', value: 1, showChart: true, showHints: true }, opts);
  }
}

/* ===== LESSON PLAYER ===== */
const COUNTED = { TAP: true, NUM: true, FLASH: true };

function itemKey(ex) {
  if (ex.type === 'TAP' || ex.type === 'BLANK') return 'dec2bin:' + ex.type + ':' + ex.value;
  if (ex.type === 'NUM') return 'bin2dec:' + ex.bits;
  if (ex.type === 'SPOT') return 'spot:' + ex.value + ':' + ex.shown;
  if (ex.type === 'MCQ') return 'mcq:' + ex.prompt;
  return ex.type + ':' + String(ex.prompt || ex.value || '').slice(0, 30);
}

const Player = {
  s: null,
  refs: {},
  fb: null,
  tickId: null,
  keyHandler: null,
  renderer: null,

  stop() {
    if (this.s && this.s.flashTimer) { clearTimeout(this.s.flashTimer); }
    if (this.tickId) { clearInterval(this.tickId); this.tickId = null; }
    if (this.keyHandler) { document.removeEventListener('keydown', this.keyHandler); this.keyHandler = null; }
    if (this.renderer && this.renderer.destroy) { try { this.renderer.destroy(); } catch (e) {} }
    this.renderer = null;
    if (this.fb && this.fb.parentNode) this.fb.parentNode.removeChild(this.fb);
    this.fb = null;
    this.s = null;
    this.refs = {};
  },

  begin(params, root) {
    this.stop();
    const mode = params.mode || 'lesson';
    const lesson = params.lessonId ? LESSONS.find(l => l.id === params.lessonId) : null;
    let items = [];
    if (mode === 'boss') items = [{ type: 'BOSS', durationSec: CONFIG.bossDurationSec, pool: 'mixed', max: 255 }];
    else if (mode === 'flash') items = Array.from({ length: 15 }, () => makeRandomItem('mixed', 255));
    else if (mode === 'weak') items = this.weakItems();
    else if (lesson) {
      if (mode === 'practice') items = shuffle(lesson.items).slice(0, Math.min(12, lesson.items.length));
      else items = lesson.items.slice(0, CONFIG.sessionItemCap);
    }
    const isBoss = items.length === 1 && items[0].type === 'BOSS';
    this.s = {
      mode, lesson, lessonId: lesson ? lesson.id : null, items, idx: 0,
      isBoss, pool: isBoss ? items[0].pool : null,
      results: [], combo: 0, maxCombo: 0, xp: 0,
      attempts: 0, correct: 0, convCorrect: 0, convMs: 0,
      itemStart: 0, itemsStart: 0, bossEnd: 0, bossCount: 0,
      pendingFail: false, state: 'IDLE',
      ghostCpm: (mode === 'ghost' && lesson ? (P.lessons[lesson.id] || {}).bestCpm : null),
      root
    };
    this.refs.root = root;
    this.fb = el('div', { class: 'feedback', role: 'status', 'aria-live': 'polite' });
    document.body.appendChild(this.fb);

    this.keyHandler = (e) => {
      if (!this.s) return;
      if (e.key === 'Escape') { e.preventDefault(); this.confirmQuit(); return; }
      if (e.key === 'Enter') {
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        e.preventDefault();
        const btn = this.refs.check;
        if (btn && !btn.disabled && btn.offsetParent !== null) btn.click();
      }
    };
    document.addEventListener('keydown', this.keyHandler);

    if (lesson && lesson.theory && lesson.theory.length && (mode === 'lesson' || mode === 'ghost' || isBoss)) {
      this.showTheory(0);
    } else {
      this.startItems();
    }
  },

  weakItems() {
    const pool = [];
    LESSONS.forEach(l => l.items.forEach(it => {
      const rec = P.srs[itemKey(it)];
      if (rec && rec.errorCount > 0 && (rec.nextDueLessonIndex || 0) <= 0) pool.push(it);
    }));
    if (!pool.length) {
      LESSONS.forEach(l => { if ((P.lessons[l.id] || {}).completed) l.items.forEach(it => { if (it.type === 'TAP' || it.type === 'NUM') pool.push(it); }); });
    }
    if (!pool.length) {
      LESSONS.slice(0, 5).forEach(l => l.items.forEach(it => { if (it.type === 'TAP' || it.type === 'NUM') pool.push(it); }));
    }
    return shuffle(pool).slice(0, 12);
  },

  /* ---------- theory viewer ---------- */
  showTheory(index) {
    const s = this.s, lesson = s.lesson || LESSONS[0];
    const t = lesson.theory[index];
    const root = s.root;
    root.innerHTML = '';
    root.classList.add('theory');
    const top = el('div', { class: 'theory-top' });
    top.appendChild(el('button', {
      class: 'icon-btn', 'aria-label': 'Back', text: '←',
      onclick: () => { if (index > 0) this.showTheory(index - 1); else this.confirmQuit(); }
    }));
    const dots = el('div', { class: 'dots', 'aria-label': 'Screen ' + (index + 1) + ' of ' + lesson.theory.length });
    lesson.theory.forEach((_, i) => dots.appendChild(el('i', { class: i === index ? 'on' : '' })));
    top.appendChild(dots);
    top.appendChild(el('button', { class: 'icon-btn', 'aria-label': 'Quit lesson', text: '✕', onclick: () => this.confirmQuit() }));
    root.appendChild(top);

    const card = el('div', { class: 'theory-card' });
    card.appendChild(el('div', { class: 'tiny muted', text: 'Lesson ' + lesson.id + ' · ' + lesson.title }));
    card.appendChild(el('h1', { text: t.heading }));
    card.appendChild(el('p', { text: t.body }));
    const vis = el('div', { class: 'theory-visual' });
    vis.appendChild(renderVisual(t.visual));
    card.appendChild(vis);
    card.appendChild(el('div', { class: 'takeaway', html: icon('bulb') + ' ' + esc(t.takeaway) }));
    root.appendChild(card);

    const foot = el('div', { class: 'theory-footer' });
    const last = index === lesson.theory.length - 1;
    foot.appendChild(el('button', {
      class: 'btn btn-primary btn-lg grow', type: 'button',
      text: last ? 'Start practice' : 'Continue',
      onclick: () => {
        AudioKit.play('buttonPress');
        if (last) this.startItems(); else this.showTheory(index + 1);
      }
    }));
    root.appendChild(foot);
    setTimeout(() => { const b = foot.querySelector('button'); if (b) b.focus({ preventScroll: true }); }, 60);
  },

  /* ---------- play chrome ---------- */
  mountPlay() {
    const s = this.s, root = s.root;
    root.innerHTML = '';
    root.classList.remove('theory');
    root.classList.add('player');

    const top = el('div', { class: 'player-top' });
    this.refs.quit = el('button', { class: 'icon-btn', 'aria-label': 'Quit session', text: '✕', onclick: () => this.confirmQuit() });
    top.appendChild(this.refs.quit);
    this.refs.pbarWrap = el('div', { class: 'pbar-wrap' });
    this.refs.pbar = el('div', { class: 'pbar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': '0', 'aria-label': 'Progress' });
    this.refs.pbarWrap.appendChild(this.refs.pbar);
    top.appendChild(this.refs.pbarWrap);
    this.refs.hearts = el('div', { class: 'chip hearts player-hearts' });
    top.appendChild(this.refs.hearts);
    root.appendChild(top);

    this.refs.metaRow = el('div', { class: 'player-sub' });
    this.refs.count = el('div', { class: 'pill', text: '0 / 0' });
    this.refs.combo = el('div', { class: 'pill combo off' });
    this.refs.timer = el('div', { class: 'pill timer' });
    this.refs.timer.innerHTML = icon('timer') + '<b>0:00</b>';
    this.refs.xp = el('div', { class: 'pill xp' });
    this.refs.xp.innerHTML = icon('bolt', '', true) + '<b>0</b>';
    this.refs.metaRow.appendChild(this.refs.count);
    this.refs.metaRow.appendChild(this.refs.combo);
    this.refs.metaRow.appendChild(this.refs.timer);
    this.refs.metaRow.appendChild(this.refs.xp);
    root.appendChild(this.refs.metaRow);

    this.refs.slot = el('div', { class: 'exercise' });
    root.appendChild(this.refs.slot);

    const foot = el('div', { class: 'player-foot' });
    this.refs.check = el('button', {
      class: 'btn btn-primary btn-lg block', type: 'button', text: 'Check',
      onclick: () => this.onPrimary()
    });
    foot.appendChild(this.refs.check);
    foot.appendChild(el('div', { class: 'check-hint', html: 'Press <kbd>Enter</kbd> to check · keys <kbd>1</kbd>–<kbd>8</kbd> flip bits' }));
    root.appendChild(foot);

    this.paintHearts();
    this.paintCombo();
    this.buildProgress();
  },

  paintHearts() {
    if (!this.refs.hearts) return;
    if (this.s.mode !== 'lesson') {
      const modeIcon = this.s.isBoss ? icon('flame', '', true) : this.s.mode === 'flash' ? icon('bolt', '', true) : icon('target');
      this.refs.hearts.innerHTML = '<span class="em">' + modeIcon + ' ' + (this.s.isBoss ? 'Boss' : this.s.mode === 'flash' ? 'Flash' : 'Practice') + '</span>';
      this.refs.hearts.classList.remove('low');
      return;
    }
    const parts = [];
    for (let i = 0; i < CONFIG.heartsMax; i++) parts.push('<span class="heart ' + (i < P.hearts ? '' : 'empty') + '">' + (i < P.hearts ? '♥' : '♡') + '</span>');
    this.refs.hearts.innerHTML = parts.join('');
    this.refs.hearts.classList.toggle('low', P.hearts <= 2);
    this.refs.hearts.setAttribute('aria-label', P.hearts + ' of ' + CONFIG.heartsMax + ' hearts');
  },

  paintCombo() {
    if (!this.refs.combo) return;
    const c = this.s.combo;
    if (c < 2) { this.refs.combo.classList.add('off'); return; }
    const mult = this.multiplier();
    const flames = icon('flame', '', true).repeat(c >= 4 ? 3 : c === 3 ? 2 : 1);
    this.refs.combo.classList.remove('off');
    this.refs.combo.innerHTML = flames + ' <span>' + (mult % 1 === 0 ? mult : mult.toFixed(1)) + '×</span>';
    this.refs.combo.setAttribute('aria-label', 'Combo multiplier ' + mult + ' times');
  },

  multiplier() {
    const c = this.s ? this.s.combo : 0;
    if (c >= 4) return CONFIG.comboMaxMultiplier;
    if (c === 3) return 2;
    if (c === 2) return 1.5;
    return 1;
  },

  paintXp() {
    if (!this.refs.xp) return;
    const b = this.refs.xp.querySelector('b');
    if (b) { b.textContent = String(this.s.xp); b.classList.remove('roll'); void b.offsetWidth; b.classList.add('roll'); }
  },

  buildProgress() {
    const s = this.s, pbar = this.refs.pbar;
    pbar.innerHTML = '';
    if (s.isBoss) {
      pbar.classList.add('boss');
      this.refs.bossFill = el('i');
      pbar.appendChild(this.refs.bossFill);
    } else {
      pbar.classList.remove('boss');
      for (let i = 0; i < s.items.length; i++) pbar.appendChild(el('div', { class: 'pseg' }, el('i')));
      if (pbar.firstChild) pbar.firstChild.classList.add('now');
    }
    if (s.ghostCpm) {
      const ghost = el('div', { class: 'ghost ahead', style: { left: '0%' }, title: 'Your best pace' });
      ghost.innerHTML = icon('ghost');
      this.refs.ghost = ghost;
      this.refs.pbarWrap.appendChild(ghost);
      this.refs.metaRow.appendChild(el('div', { class: 'pill', html: icon('ghost') + ' vs you · ' + fmtCpm(s.ghostCpm) + ' CPM' }));
    }
  },

  markProgress() {
    const s = this.s;
    if (!this.refs.pbar) return;
    if (!s.isBoss) {
      const segs = this.refs.pbar.children;
      for (let i = 0; i < segs.length; i++) {
        const on = i < s.idx;
        const was = segs[i].classList.contains('on');
        segs[i].classList.toggle('on', on);
        segs[i].classList.toggle('now', i === s.idx);
        if (on && !was) {
          segs[i].classList.add('pop');
          setTimeout(((node) => () => node.classList.remove('pop'))(segs[i]), 320);
        }
      }
      this.refs.pbar.setAttribute('aria-valuenow', String(Math.round((Math.min(s.idx, s.items.length) / s.items.length) * 100)));
    }
  },

  /* ---------- item loop ---------- */
  startItems() {
    const s = this.s;
    this.mountPlay();
    s.state = 'SHOWING_ITEM';
    s.itemsStart = performance.now();
    if (s.isBoss) { this.startBoss(); return; }
    this.showItem();
  },

  showItem() {
    const s = this.s;
    if (s.idx >= s.items.length) { this.finish('complete'); return; }
    s.state = 'SHOWING_ITEM';
    const ex = s.items[s.idx];
    s.currentEx = ex;
    this.refs.slot.innerHTML = '';
    this.refs.check.textContent = 'Check';
    this.refs.check.disabled = false;
    this.refs.check.style.display = '';
    this.hideFeedback();
    this.markProgress();
    this.refs.count.textContent = (s.idx + 1) + ' / ' + s.items.length;
    if (this.refs.ghost) this.refs.ghost.style.display = '';

    const renderer = renderExercise(ex, {
      onAutoSubmit: () => this.onPrimary(),
      onMistake: (expl) => this.registerMistake(expl),
      onSolved: (expl) => this.judge({ correct: true, explanation: expl })
    });
    this.renderer = renderer;
    this.refs.slot.appendChild(renderer.el);
    s.itemStart = performance.now();
    s.state = 'AWAITING_INPUT';

    this.refs.check.style.display = renderer.auto ? 'none' : '';
    if (renderer.auto) {
      this.refs.slot.appendChild(el('div', { class: 'check-hint', text: ex.type === 'MATCH' ? 'Match every pair to continue' : 'Type the answer — it submits automatically' }));
    }
    if (renderer.focus) setTimeout(() => { try { renderer.focus(); } catch (e) {} }, 80);
    if (s.mode === 'flash') {
      const bar = el('div', { class: 'flash-bar', 'aria-label': 'Time remaining' }, el('i'));
      bar.querySelector('i').style.animationDuration = CONFIG.flashItemMs + 'ms';
      this.refs.slot.insertBefore(bar, this.refs.slot.firstChild);
      this.armFlashDeadline();
    }
    this.startTimerLoop();
  },

  armFlashDeadline() {
    const s = this.s;
    if (!s) return;
    if (s.flashTimer) clearTimeout(s.flashTimer);
    s.flashTimer = setTimeout(() => {
      if (!this.s || this.s.state !== 'AWAITING_INPUT') return;
      const ex = this.s.currentEx || {};
      const expl = ex.bits ? 'Time! ' + ex.bits + ' = ' + nibbleText(ex.bits) : 'Time! 1.5 seconds per item — answer faster.';
      this.judge({ correct: false, explanation: expl });
    }, CONFIG.flashItemMs);
  },

  startTimerLoop() {
    if (this.tickId) clearInterval(this.tickId);
    const s = this.s;
    const needsTimer = s.isBoss || (s.lesson && s.lesson.scaffold.timer) || s.mode === 'flash';
    if (this.refs.timer) this.refs.timer.style.display = needsTimer ? '' : 'none';
    const update = () => {
      if (!this.s || !this.refs.timer) return;
      const now = performance.now();
      if (this.s.isBoss) {
        const left = Math.max(0, this.s.bossEnd - now);
        this.refs.timer.innerHTML = '<span class="em">⏱</span><b>' + (left / 1000).toFixed(1) + 's</b>';
        this.refs.timer.classList.toggle('low', left < 10000);
        if (this.refs.bossFill) this.refs.bossFill.style.transform = 'scaleX(' + (left / (this.s.bossDurationMs || 60000)) + ')';
        if (left <= 0) this.finish('boss');
        return;
      }
      const el2 = Math.floor((now - this.s.itemsStart) / 1000);
      this.refs.timer.innerHTML = '<span class="em">⏱</span><b>' + Math.floor(el2 / 60) + ':' + String(el2 % 60).padStart(2, '0') + '</b>';
      this.updateGhost();
    };
    update();
    this.tickId = setInterval(update, 100);
  },

  updateGhost() {
    const s = this.s;
    if (!s || !s.ghostCpm || !this.refs.ghost) return;
    const total = s.items.length;
    const expectedMs = (total / s.ghostCpm) * 60000;
    const elapsed = performance.now() - s.itemsStart;
    const frac = clamp(elapsed / expectedMs, 0, 1);
    this.refs.ghost.style.left = 'calc(' + (frac * 100) + '% - 8px)';
    const mine = s.idx / total;
    const ahead = mine >= frac;
    this.refs.ghost.classList.toggle('ahead', ahead);
    this.refs.ghost.classList.toggle('behind', !ahead);
    this.refs.ghost.title = ahead ? 'You are ahead of your best pace' : 'Your best pace is ahead of you';
  },

  /* ---------- boss ---------- */
  startBoss() {
    const s = this.s;
    const cfg = s.items[0];
    s.bossDurationMs = (cfg.durationSec || CONFIG.bossDurationSec) * 1000;
    s.bossEnd = performance.now() + s.bossDurationMs;
    s.bossCount = 0;
    AudioKit.play('bossStart');
    this.refs.count.textContent = '0 correct';
    this.showBossItem();
  },

  showBossItem() {
    const s = this.s;
    if (!s || s.state === 'DONE') return;
    s.state = 'SHOWING_ITEM';
    this.refs.slot.innerHTML = '';
    this.refs.check.textContent = 'Check';
    const ex = makeRandomItem(s.pool || 'mixed', 255);
    s.currentEx = ex;
    const renderer = renderExercise(ex, {
      onAutoSubmit: () => this.onPrimary(),
      onMistake: (e) => this.registerMistake(e),
      onSolved: (e) => this.judge({ correct: true, explanation: e })
    });
    this.renderer = renderer;
    this.refs.slot.appendChild(renderer.el);
    this.refs.slot.appendChild(el('div', { class: 'check-hint', text: 'No hints. No chart. Go.' }));
    s.itemStart = performance.now();
    s.state = 'AWAITING_INPUT';
    this.refs.check.style.display = renderer.auto ? 'none' : '';
    if (renderer.focus) setTimeout(() => { try { renderer.focus(); } catch (e) {} }, 40);
  },

  /* ---------- judging ---------- */
  registerMistake(explanation) {
    const s = this.s;
    if (!s) return;
    s.attempts++;
    P.stats.attempts++;
    AudioKit.play('wrong');
    this.breakCombo();
    if (s.mode === 'lesson' && !s.isBoss) {
      spendHeart();
      this.paintHearts();
      AudioKit.play('heartLoss');
      haptic(24);
      if (P.hearts <= 0) s.pendingFail = true;
    }
    toast(explanation);
  },

  breakCombo() {
    const s = this.s;
    if (!s) return;
    if (s.combo >= 2 && this.refs.combo) {
      this.refs.combo.classList.add('fizzle');
      setTimeout(() => { if (this.refs.combo) this.refs.combo.classList.remove('fizzle'); }, 460);
    }
    s.combo = 0;
    this.paintCombo();
  },

  onPrimary() {
    const s = this.s;
    if (!s) return;
    if (s.state === 'FEEDBACK') { this.advance(); return; }
    if (s.state !== 'AWAITING_INPUT' || !this.renderer) return;
    let res = null;
    try { res = this.renderer.check(); } catch (e) { res = null; }
    if (!res) return;
    this.judge(res);
  },

  judge(res) {
    const s = this.s;
    if (!s || s.state !== 'AWAITING_INPUT') return;
    if (s.flashTimer) { clearTimeout(s.flashTimer); s.flashTimer = null; }
    const ex = s.currentEx || {};
    const timeMs = performance.now() - s.itemStart;
    s.attempts++;
    P.stats.attempts++;
    const counted = !!COUNTED[ex.type];
    s.results.push({ correct: res.correct, timeMs, type: ex.type });
    if (res.correct) {
      s.correct++;
      P.stats.correct++;
      /* only correct conversions earn speed — a wrong answer must never raise CPM */
      if (counted) { s.convMs += timeMs; s.convCorrect++; P.stats.conversions++; }
    }
    if (s.mode === 'weak' || s.mode === 'practice' || s.mode === 'flash') this.trackSrs(ex, res.correct);

    if (res.correct) {
      if (timeMs <= CONFIG.comboWindowMs) s.combo += 1; else s.combo = 1;
      s.maxCombo = Math.max(s.maxCombo, s.combo);
      const mult = this.multiplier();
      const gain = Math.max(1, Math.round(mult));
      s.xp += gain;
      this.paintXp();
      this.refs.slot.classList.remove('shake');
      this.refs.slot.classList.remove('bounce');
      void this.refs.slot.offsetWidth;
      this.refs.slot.classList.add('bounce');
      AudioKit.play('correct');
      if (s.combo >= 2) AudioKit.play('comboUp');
      if (s.combo === 4) { confettiBurst(36); AudioKit.play('streakMilestone'); }
      haptic(10);
      this.paintCombo();
      flyXp(gain, this.refs.check);
      if (s.isBoss) {
        s.bossCount++;
        this.refs.count.textContent = s.bossCount + ' correct';
        this.refs.slot.classList.add('flash-good');
        setTimeout(() => { if (this.refs.slot) this.refs.slot.classList.remove('flash-good'); }, 180);
        s.idx++;
        this.showBossItem();
        return;
      }
      this.showFeedback(true, res.explanation);
    } else {
      this.breakCombo();
      AudioKit.play('wrong');
      haptic(30);
      if (s.mode === 'lesson' && !s.isBoss) {
        spendHeart();
        this.paintHearts();
        AudioKit.play('heartLoss');
        if (P.hearts <= 0) s.pendingFail = true;
      }
      this.refs.slot.classList.remove('bounce');
      this.refs.slot.classList.remove('shake');
      void this.refs.slot.offsetWidth;
      this.refs.slot.classList.add('shake');
      if (s.isBoss) {
        this.refs.slot.classList.add('flash-bad');
        setTimeout(() => { if (this.refs.slot) this.refs.slot.classList.remove('flash-bad'); }, 200);
        s.idx++;
        this.showBossItem();
        return;
      }
      this.showFeedback(false, res.explanation);
    }
    this.markProgress();
  },

  trackSrs(ex, correct) {
    const key = itemKey(ex);
    const rec = P.srs[key] || { nextDueLessonIndex: 0, errorCount: 0, lastSeen: null };
    rec.lastSeen = Date.now();
    if (correct) rec.nextDueLessonIndex = Math.min(4, (rec.nextDueLessonIndex || 0) + 2);
    else { rec.errorCount = (rec.errorCount || 0) + 1; rec.nextDueLessonIndex = 0; }
    P.srs[key] = rec;
    save();
  },

  showFeedback(good, explanation) {
    const s = this.s;
    s.state = 'FEEDBACK';
    this.refs.check.textContent = 'Continue';
    this.refs.check.disabled = false;
    if (!this.fb) return;
    this.fb.className = 'feedback ' + (good ? 'good' : 'bad');
    this.fb.innerHTML = '';
    const head = el('div', { class: 'feedback-head' });
    head.innerHTML = '<span class="icon">' + icon(good ? 'check' : 'cross') + '</span><span>' + (good ? 'Correct' : 'Not quite') + '</span>';
    if (good) {
      const xpChip = el('div', { class: 'fb-xp pop' });
      xpChip.innerHTML = icon('bolt', '', true) + '<b>0</b><span>XP</span>';
      head.appendChild(xpChip);
      animateCount(xpChip.querySelector('b'), s.xp, 560);
    }
    this.fb.appendChild(head);
    this.fb.appendChild(el('p', { text: explanation || (good ? 'Nice work.' : 'Look at the walk again.') }));
    const foot = el('div', { class: 'feedback-foot' });
    if (!good) foot.appendChild(el('div', { class: 'auto-note', text: s.mode === 'lesson' ? '−1 heart · accuracy drops' : 'Keep going — accuracy is counted' }));
    foot.appendChild(el('button', {
      class: 'btn btn-primary', type: 'button',
      text: s.pendingFail ? 'See results' : 'Continue',
      onclick: () => this.advance()
    }));
    this.fb.appendChild(foot);
    requestAnimationFrame(() => this.fb.classList.add('show'));
    setTimeout(() => { if (!this.fb) return; const b = this.fb.querySelector('.btn'); if (b) b.focus({ preventScroll: true }); }, 140);
  },

  hideFeedback() {
    if (this.fb) { this.fb.classList.remove('show'); this.fb.innerHTML = ''; }
  },

  advance() {
    const s = this.s;
    if (!s) return;
    this.hideFeedback();
    if (this.renderer && this.renderer.destroy) this.renderer.destroy();
    this.renderer = null;
    if (s.pendingFail) { this.finish('failed'); return; }
    s.idx++;
    this.markProgress();
    this.showItem();
  },

  confirmQuit() {
    if (!this.s) return;
    const wasBoss = this.s.isBoss;
    openModal({
      title: 'Leave this session?',
      body: wasBoss ? 'This run will not be scored.' : "You'll lose the progress from this attempt.",
      actions: [
        { label: 'Keep going', variant: 'secondary' },
        { label: 'Leave', variant: 'danger', onClick: () => { this.stop(); goHome(); } }
      ]
    });
  },

  finish(reason) {
    const s = this.s;
    if (!s || s.state === 'DONE') return;
    s.state = 'DONE';
    if (this.tickId) { clearInterval(this.tickId); this.tickId = null; }
    if (this.fb) { this.fb.classList.remove('show'); }

    const accuracy = s.attempts ? s.correct / s.attempts : 0;
    let cpm = null;
    if (s.isBoss) cpm = Math.round(s.bossCount * (60000 / s.bossDurationMs) * 10) / 10;
    else if (s.convMs > 0) cpm = Math.round((s.convCorrect / (s.convMs / 60000)) * 10) / 10;
    /* a run where most answers were wrong has no meaningful speed score */
    if (!s.isBoss && s.attempts > 0 && s.correct / s.attempts < 0.5) cpm = null;

    const lesson = s.lesson;
    const dirCount = { dec2bin: 0, bin2dec: 0 };
    s.items.forEach(it => { if (it.type === 'TAP' || it.type === 'BLANK' || it.type === 'SPOT') dirCount.dec2bin++; else if (it.type === 'NUM') dirCount.bin2dec++; });
    const dir = dirCount.bin2dec > dirCount.dec2bin ? 'bin2dec' : 'dec2bin';

    const mode = s.mode;
    const accGate = lesson ? lesson.passCriteria.accuracy : CONFIG.practiceGate;
    const cpmGate = lesson ? lesson.passCriteria.cpm : null;
    const metAccuracy = accuracy >= accGate;
    const metCpm = !cpmGate || (cpm != null && cpm >= cpmGate);

    let passed = reason === 'complete';
    let gateNote = '';
    if (mode === 'lesson' || mode === 'ghost') {
      passed = passed && metAccuracy && metCpm;
      if (passed !== true) gateNote = !metAccuracy ? 'accuracy' : !metCpm ? 'cpm' : '';
      if (passed && !metAccuracy) gateNote = 'accuracy';
    } else if (mode === 'practice') {
      passed = reason === 'complete' && accuracy >= CONFIG.practiceGate;
      if (!passed) gateNote = 'accuracy';
    } else if (s.isBoss) {
      passed = true;
    }

    let xpEarned = 0, gemsEarned = 0, firstClear = false, practicePassed = false, pb = false, stars = 0, crown = false;
    let cappedOut = 0, rewardNote = '';

    if (mode === 'lesson' || mode === 'ghost') {
      const st = lessonState(lesson.id);
      if (passed) {
        firstClear = !st.paidClear;
        const gates = CONFIG.cpm[dir] || CONFIG.cpm.dec2bin;
        if (metAccuracy) stars = 1;
        if (cpm != null && cpm >= gates[1]) stars = 2;
        if (cpm != null && cpm >= gates[2]) stars = 3;
        crown = cpm != null && cpm >= gates[3];

        st.completed = true;
        st.attempts = (st.attempts || 0) + 1;
        st.lastPlayed = Date.now();
        st.stars = Math.max(st.stars || 0, stars);
        st.crown = !!(st.crown || crown);
        if (st.bestAccuracy == null || accuracy > st.bestAccuracy) st.bestAccuracy = accuracy;
        if (cpm != null && (st.bestCpm == null || cpm > st.bestCpm)) {
          if (st.bestCpm != null) pb = true;
          st.bestCpm = cpm;
        }
        st.paidClear = true;

        xpEarned = (firstClear ? lesson.xp : Math.round(lesson.xp * CONFIG.replayXpFactor)) + s.xp;
        if (firstClear) {
          gemsEarned += CONFIG.firstClearGems;
          rewardNote = 'First clear bonus applied';
        } else {
          rewardNote = 'Replay — reduced XP, no clear bonus';
        }
        if (pb) {
          const d = dailyBucket();
          if (!d.gemDays['pb:' + lesson.id]) {
            gemsEarned += CONFIG.pbGems;
            d.gemDays['pb:' + lesson.id] = true;
          }
        }
        const streakGrew = touchDailyStreak();
        if (streakGrew) AudioKit.play('streakMilestone');
      } else {
        lessonState(lesson.id).attempts = (lessonState(lesson.id).attempts || 0) + 1;
      }
    } else if (mode === 'practice' && lesson) {
      const st = lessonState(lesson.id);
      st.practiceAttempts = (st.practiceAttempts || 0) + 1;
      st.lastPractice = Date.now();
      if (accuracy > (st.practiceBest || 0)) st.practiceBest = accuracy;
      if (passed) {
        st.practicePassed = true;
        practicePassed = true;
        rewardNote = 'Answer XP only — practice pays no base reward';
      } else {
        rewardNote = 'Practice needs ' + pct(CONFIG.practiceGate) + ' accuracy to pass';
      }
      xpEarned = s.xp;
    } else if (s.isBoss) {
      const paid = !modePaidToday('boss');
      if (paid) markModePaid('boss');
      xpEarned = (paid ? CONFIG.xpPerBoss : 0) + s.xp;
      gemsEarned += paid ? 50 : 0;
      rewardNote = paid ? 'Boss reward claimed for today' : 'Boss reward already claimed today';
      if (P.bossBest == null || cpm > P.bossBest) { if (P.bossBest != null) pb = true; P.bossBest = cpm; }
    } else if (mode === 'flash') {
      const paid = !modePaidToday('flash');
      if (paid) markModePaid('flash');
      xpEarned = (paid ? 5 : 0) + s.xp;
      rewardNote = paid ? 'First flash round today paid a base reward' : 'Answer XP only for extra flash rounds';
      if (P.flashBest == null || cpm > P.flashBest) P.flashBest = cpm;
    } else {
      xpEarned = s.xp;
      rewardNote = 'Answer XP only';
    }

    if (cpm != null) {
      if (P.pbs[dir] == null || cpm > P.pbs[dir]) {
        if (P.pbs[dir] != null) pb = true;
        P.pbs[dir] = cpm;
      }
    }
    if (pb) {
      const today = dayKey();
      if (P.speedStreak.lastDay !== today) {
        const gap = P.speedStreak.lastDay ? daysBetween(P.speedStreak.lastDay, today) : Infinity;
        P.speedStreak.count = gap === 1 ? P.speedStreak.count + 1 : 1;
        P.speedStreak.lastDay = today;
      }
    }
    if (passed) {
      const asked = xpEarned;
      xpEarned = capDailyXp(asked);
      cappedOut = asked - xpEarned;
      const gems = capDailyGems(gemsEarned);
      P.gems += gems;
      gemsEarned = gems;
      P.stats.sessions++;
      recordHistory({ cpm: cpm || 0, accuracy, dir, mode });
      if (mode === 'weak') {
        P.weakSessions++;
        Object.keys(P.srs).forEach(k => { const r = P.srs[k]; r.nextDueLessonIndex = Math.max(0, (r.nextDueLessonIndex || 0) - 1); });
      }
    } else {
      gemsEarned = 0;
    }
    save(true);

    const levelInfo = awardXp(xpEarned);
    save(true);
    AudioKit.play(passed ? 'lessonComplete' : 'wrong');
    const params = {
      mode, reason, lessonId: s.lessonId,
      accuracy, cpm, xp: xpEarned, gems: gemsEarned, stars, crown, pb,
      passed, practicePassed, firstClear, gateNote, capped: cappedOut, rewardNote,
      accGate: mode === 'practice' ? CONFIG.practiceGate : accGate, cpmGate,
      attempts: s.attempts, correct: s.correct, maxCombo: s.maxCombo,
      bossCount: s.isBoss ? s.bossCount : null,
      flush: true, levelUp: levelInfo.levelUp, level: P.level
    };
    this.stop();
    navigate('results', params);
  }
};

function resultsScreen(p) {
  refillHearts();
  const screen = el('div', { class: 'results' });
  const passed = p.passed != null ? p.passed : (p.reason === 'complete' || p.reason === 'boss');
  const didPass = passed;
  const lesson = p.lessonId ? LESSONS.find(l => l.id === p.lessonId) : null;
  const lessonIdx = lesson ? LESSONS.findIndex(l => l.id === lesson.id) : -1;
  const nextLesson = lessonIdx > -1 ? LESSONS[lessonIdx + 1] || null : null;

  screen.appendChild(mascotBlock(didPass ? 'celebrate' : 'worried'));
  let title = 'Session complete';
  let sub = 'Good reps. Keep the streak alive.';
  if (p.reason === 'failed') { title = 'Out of hearts.'; sub = 'Take a breath, then go again.'; }
  else if (p.mode === 'boss') { title = 'Boss run complete'; sub = '60 seconds of pure conversion.'; }
  else if (p.mode === 'flash') { title = 'Flash round done'; sub = 'Fast hands, fast brain.'; }
  else if (p.mode === 'weak') { title = 'Weak spots worked'; sub = 'Those items will resurface later.'; }
  else if (p.mode === 'practice') {
    title = didPass ? 'Practice passed!' : 'Practice not passed';
    sub = didPass
      ? (nextLesson ? 'Nice — Lesson ' + nextLesson.id + ' is unlocked.' : 'Nice — every lesson is open.')
      : 'You answered ' + pct(p.accuracy) + '. Practice needs ' + pct(p.accGate) + ' correct.';
  }
  else if (lesson && didPass) { title = 'Lesson complete!'; sub = lesson.title + ' · ' + lesson.subtitle; }
  else if (lesson) {
    title = 'Not passed yet';
    sub = p.gateNote === 'cpm'
      ? 'Accuracy was fine — you need ' + p.cpmGate + ' CPM to pass this one.'
      : 'You answered ' + pct(p.accuracy) + ', below the ' + pct(p.accGate) + ' pass bar.';
  }
  screen.appendChild(el('h1', { text: title }));
  screen.appendChild(el('div', { class: 'sub', text: sub }));

  if (p.mode === 'lesson') {
    let stars = '';
    for (let i = 0; i < 3; i++) stars += '<span class="' + (i < p.stars ? '' : 'off') + '">' + icon('star', '', true) + '</span>';
    screen.appendChild(el('div', { class: 'result-stars', html: stars + (p.crown ? icon('crown', '', true) : '') }));
  }
  if (p.pb) {
    screen.appendChild(el('div', {
      class: 'chip', style: { background: '#FFFBEB', borderColor: '#FDE68A', color: '#B45309' },
      html: icon('trophy') + ' New personal best!' + (p.cpm != null ? ' ' + fmtCpm(p.cpm) + ' CPM' : '')
    }));
  }

  const grid = el('div', { class: 'stat-grid' });
  grid.appendChild(statCard(pct(p.accuracy), 'Accuracy', p.accuracy >= 0.9 ? 'green' : 'amber', 0));
  grid.appendChild(statCard(p.cpm == null ? '—' : fmtCpm(p.cpm), 'CPM', 'purple', 60));
  grid.appendChild(statCard('+' + p.xp, 'XP earned', 'green', 120));
  grid.appendChild(statCard(p.mode === 'boss' ? String(p.bossCount || 0) : String(p.maxCombo || 0), p.mode === 'boss' ? 'Correct' : 'Best combo', '', 180));
  screen.appendChild(grid);

  if (p.gems > 0) {
    screen.appendChild(el('div', {
      class: 'chip', style: { background: '#F5EDFF', borderColor: '#E4D4FF', color: '#7B3FD1' },
      html: icon('gem', '', true) + ' +' + p.gems + ' gems'
    }));
  }
  if (p.rewardNote) screen.appendChild(el('div', { class: 'tiny muted', text: p.rewardNote }));
  if (p.capped > 0) screen.appendChild(el('div', { class: 'tiny muted', text: 'Daily XP cap reached — ' + p.capped + ' XP was not counted.' }));

  const actions = el('div', { class: 'actions' });

  if (p.reason === 'failed' || (!didPass && p.mode === 'lesson')) {
    actions.appendChild(el('button', {
      class: 'btn btn-primary block', type: 'button',
      text: p.reason === 'failed' ? 'Retry (hearts refilled)' : 'Try again',
      onclick: () => {
        if (P.hearts <= 0) { P.hearts = CONFIG.heartsMax; P.heartsRefilledAt = Date.now(); save(true); }
        navigate('player', { lessonId: p.lessonId, mode: 'lesson' });
      }
    }));
    actions.appendChild(el('button', {
      class: 'btn btn-secondary block', type: 'button', text: 'Practice this lesson',
      onclick: () => navigate('player', { lessonId: p.lessonId, mode: 'practice' })
    }));
  } else if (!didPass && p.mode === 'practice') {
    actions.appendChild(el('button', {
      class: 'btn btn-primary block', type: 'button', text: 'Practice again',
      onclick: () => navigate('player', { lessonId: p.lessonId, mode: 'practice' })
    }));
    actions.appendChild(el('button', {
      class: 'btn btn-secondary block', type: 'button', text: 'Review the lesson',
      onclick: () => { const idx = lessonIdx >= 0 ? lessonIdx : 0; setTimeout(() => openLessonSheet(idx), 80); goHome(); }
    }));
  } else {
    if (nextLesson && (p.mode === 'lesson' || p.mode === 'practice') && isUnlocked(lessonIdx + 1)) {
      actions.appendChild(el('button', {
        class: 'btn btn-primary block', type: 'button', text: 'Next lesson · ' + nextLesson.id,
        onclick: () => openLessonSheet(lessonIdx + 1)
      }));
    } else if (nextLesson && p.mode === 'lesson' && !isUnlocked(lessonIdx + 1)) {
      actions.appendChild(el('button', {
        class: 'btn btn-primary block', type: 'button', text: 'Practice to unlock · ' + nextLesson.id,
        onclick: () => navigate('player', { lessonId: lesson.id, mode: 'practice' })
      }));
      actions.appendChild(el('div', {
        class: 'tiny muted', style: { textAlign: 'center' },
        text: 'Lesson ' + nextLesson.id + ' opens after a practice pass at ' + pct(CONFIG.practiceGate) + ' accuracy.'
      }));
    }
    if (lesson) {
      actions.appendChild(el('button', {
        class: 'btn ' + (nextLesson ? 'btn-secondary' : 'btn-primary') + ' block', type: 'button',
        text: p.mode === 'practice' ? 'Practice again' : 'Retry for speed',
        onclick: () => navigate('player', { lessonId: lesson.id, mode: p.mode === 'practice' ? 'practice' : 'lesson' })
      }));
    } else if (p.mode === 'boss' || p.mode === 'flash' || p.mode === 'weak') {
      actions.appendChild(el('button', {
        class: 'btn btn-primary block', type: 'button', text: 'Go again',
        onclick: () => navigate('player', { mode: p.mode })
      }));
      actions.appendChild(el('button', {
        class: 'btn btn-secondary block', type: 'button', text: 'Practice hub',
        onclick: () => navigate('practice')
      }));
    }
  }
  actions.appendChild(el('button', {
    class: 'btn btn-ghost block', type: 'button', text: 'Home',
    onclick: () => goHome()
  }));
  screen.appendChild(actions);

  if (passed) {
    setTimeout(() => {
      confettiBurst(p.mode === 'lesson' ? 130 : 80);
      AudioKit.play(p.mode === 'lesson' ? 'lessonComplete' : 'xpGain');
    }, 160);
  }
  if (p.levelUp) {
    setTimeout(() => openModal({
      emoji: icon('party'),
      title: 'Level ' + P.level + '!',
      body: 'You earned ' + p.xp + ' XP this session. Keep the streak going.',
      actions: [{ label: 'Nice' }]
    }), 700);
  }
  return screen;
}

function drawCpmChart(canvas) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(240, rect.width);
  const h = Math.max(120, rect.height);
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const map = {};
  P.history.forEach(e => { if (e.cpm != null && e.cpm > 0) map[e.day] = Math.max(map[e.day] || 0, e.cpm); });
  const pts = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    pts.push({ k, v: map[k] == null ? null : map[k] });
  }
  const vals = pts.map(p => p.v).filter(v => v != null);
  if (!vals.length) return;
  const max = Math.max.apply(null, vals) * 1.15;
  const pad = 6;
  const bw = (w - pad * 2) / pts.length;
  pts.forEach((p, i) => {
    if (p.v == null) return;
    const bh = Math.max(3, (p.v / max) * (h - 18));
    const x = pad + i * bw + bw * 0.18;
    const y = h - 10 - bh;
    const g = ctx.createLinearGradient(0, y, 0, h);
    g.addColorStop(0, '#06B6D4'); g.addColorStop(1, '#22C55E');
    ctx.fillStyle = g;
    ctx.beginPath();
    const r = Math.min(3, bw / 2);
    ctx.moveTo(x, y + bh);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.lineTo(x + bw * 0.64 - r, y);
    ctx.quadraticCurveTo(x + bw * 0.64, y, x + bw * 0.64, y + r);
    ctx.lineTo(x + bw * 0.64, y + bh);
    ctx.closePath();
    ctx.fill();
  });
  ctx.fillStyle = '#9AA6B6';
  ctx.font = '10px -apple-system, Segoe UI, Roboto, sans-serif';
  ctx.fillText('30 days ago', pad, h - 1);
  ctx.fillText('today', w - 34, h - 1);
}

    class: 'setting-row', type: 'button', style: { width: '100%', background: 'none', border: 'none', borderBottom: '0', textAlign: 'left', cursor: 'pointer', paddingLeft: '0', paddingRight: '0', font: 'inherit' },
    onclick: () => navigate('about')
  });
  aboutRow.innerHTML = '<div><div class="t">About Binary Trainer</div><div class="d">Version, credits and links</div></div>' + icon('arrowLeft', 's-go');
  aboutRow.querySelector('.s-go').style.transform = 'rotate(180deg)';
  aboutRow.querySelector('.s-go').style.width = '18px';
  aboutRow.querySelector('.s-go').style.height = '18px';
  aboutRow.querySelector('.s-go').style.color = 'var(--color-ash)';
  aboutCard.appendChild(aboutRow);
  screen.appendChild(aboutCard);

  const footer = el('div', { class: 'tiny muted mt4', style: { textAlign: 'center' } });
  footer.innerHTML = 'Binary Trainer · offline · no accounts · no leaderboard<br>Everything lives in your browser.';
  screen.appendChild(footer);
  return screen;
}

/* ===== SCREENS: ABOUT ===== */
function aboutScreen() {
  const screen = el('div', { class: 'about' });
  screen.appendChild(pageHead('About', 'Who makes this and where to find them'));

  const hero = el('div', { class: 'card about-hero' });
  hero.innerHTML =
    '<div class="logo-ph" aria-label="Logo placeholder">01</div>' +
    '<h2>Binary Trainer</h2>' +
    '<div class="ver">Version 1.0 · offline</div>' +
    '<p>A pocket trainer for reading and writing binary. Twenty short lessons, practice that gates the next lesson, and speed runs that only count answers you got right.</p>';
  screen.appendChild(hero);

  const socialCard = el('div', { class: 'card mt4' });
  socialCard.appendChild(el('h3', { style: { fontSize: '15px' }, text: 'Find me' }));
  const list = el('div', { class: 'social-list' });
  const link = (ico, name, handle, href) => {
    const a = el('a', { class: 'social-row', href: href || '#', target: '_blank', rel: 'noopener noreferrer' });
    a.innerHTML = '<div class="s-ico">' + icon(ico, '', ico === 'x') + '</div><div class="s-txt"><b>' + name + '</b><span>' + handle + '</span></div><span class="s-go">›</span>';
    return a;
  };
  list.appendChild(link('github', 'GitHub', '@your-handle — replace this link', '#'));
  list.appendChild(link('x', 'X / Twitter', '@your-handle — replace this link', '#'));
  list.appendChild(link('youtube', 'YouTube', 'Devlogs and lesson walkthroughs', '#'));
  list.appendChild(link('globe', 'Website', 'your-domain.com', '#'));
  list.appendChild(link('mail', 'Email', 'you@example.com', 'mailto:you@example.com'));
  socialCard.appendChild(list);
  socialCard.appendChild(el('div', { class: 'ph-note', text: 'Placeholders — swap in your own logo and links' }));
  screen.appendChild(socialCard);

  const credits = el('div', { class: 'card mt4' });
  credits.appendChild(el('h3', { style: { fontSize: '15px' }, text: 'Credits' }));
  credits.appendChild(el('div', { class: 'tiny muted mt2', html: 'Built as a single offline HTML file. Type and colours follow the Duolingo design kit. Everything you do is stored on this device only — no accounts, no analytics, no network calls.' }));
  const info = el('button', {
    class: 'btn btn-secondary block mt3', type: 'button', text: 'Read the study tips',
    onclick: () => openModal({
      emoji: icon('bulb'),
      title: 'How to get faster',
      body: 'Say the place values out loud while you flip bits: 128, 64, 32, 16, 8, 4, 2, 1. Speed comes from the pattern, not from counting. Ten focused minutes beats an hour of guessing.',
      actions: [{ label: 'Got it' }]
    })
  });
  credits.appendChild(info);
  screen.appendChild(credits);

  const foot = el('div', { class: 'tiny muted mt4', style: { textAlign: 'center' } });
  foot.textContent = 'Made for people who want to read the machine.';
  screen.appendChild(foot);
  return screen;
}

/* ===== APP INIT ===== */
const SCREENS = {
  home: homeScreen,
  player: function (params) { const root = el('div'); Player.begin(params, root); return root; },
  results: resultsScreen,
  practice: practiceScreen,
  profile: profileScreen,
  settings: settingsScreen,
  about: aboutScreen
};

function applyMotionSetting() {
  if (P && P.settings) document.body.classList.toggle('reduce-motion', !!P.settings.reducedMotion);
}

document.addEventListener('pointerdown', function () { AudioKit.init(); }, { once: true });
document.addEventListener('keydown', function () { AudioKit.init(); }, { once: true });
document.addEventListener('keydown', function () { document.body.classList.add('kbd'); }, true);
document.addEventListener('pointerdown', function () { document.body.classList.remove('kbd'); }, true);

const TAB_ICONS = {
  learn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3.5l9 7.3V20a1 1 0 0 1-1 1h-5v-6.5H9V21H4a1 1 0 0 1-1-1z"/></svg>',
  practice: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2.5 4.5 13.5H11l-1 8L19.5 10H13z"/></svg>',
  stats: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11"/><path d="M10 20V4"/><path d="M16 20v-6"/><path d="M2.5 20h19"/></svg>',
  settings: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/><circle cx="9" cy="7" r="2.6" style="fill:#fff"/><circle cx="15" cy="12" r="2.6" style="fill:#fff"/><circle cx="8" cy="17" r="2.6" style="fill:#fff"/></svg>'
};

function buildTabbar() {
  if (document.getElementById('tabbar')) return;
  const bar = el('nav', { class: 'tabbar', id: 'tabbar', 'aria-label': 'Main navigation' });
  [['home', 'Learn', 'learn'], ['practice', 'Practice', 'practice'], ['profile', 'Stats', 'stats'], ['settings', 'Settings', 'settings']].forEach(function (t) {
    const btn = el('button', {
      class: 'tab', type: 'button', 'data-screen': t[0], 'aria-label': t[1],
      onclick: function () { if (currentScreenName !== t[0]) navigate(t[0]); }
    });
    btn.innerHTML = TAB_ICONS[t[2]] + '<span>' + t[1] + '</span>';
    bar.appendChild(btn);
  });
  document.body.appendChild(bar);
}

function init() {
  applyMotionSetting();
  refillHearts();
  buildTabbar();
  renderScreen('home', {}, 'none');
  let pathTimer = null;
  window.addEventListener('resize', () => { clearTimeout(pathTimer); pathTimer = setTimeout(() => drawPathLines(), 160); });
  setInterval(() => {
    if (refillHearts() && currentScreenName !== 'player' && currentScreenName !== 'results') {
      renderScreen(currentScreenName, {}, 'none');
      return;
    }
    const left = nextHeartIn();
    document.querySelectorAll('[data-heart-timer]').forEach(n => { n.textContent = fmtCountdown(left); });
  }, 1000);
}

init();

</script>
